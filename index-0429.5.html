<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邊跑邊逛 吃遍南投 - 13鄉鎮食農跑旅</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @keyframes bounce-run { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        .running { animation: bounce-run 0.3s infinite; }
        
        /* 地圖區域樣式 */
        .map-container {
            position: relative;
            background-image: url('https://api.dicebear.com/7.x/shapes/svg?seed=nantou'); /* 備用背景 */
            background-size: cover;
            background-position: center;
        }
        
        .township-overlay {
            position: absolute;
            cursor: pointer;
            border-radius: 50%;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-center: center;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.5);
        }
        
        .township-overlay:hover {
            transform: scale(1.2);
            background: rgba(255, 255, 255, 0.5);
        }

        .occupied-red { background: rgba(239, 68, 68, 0.6) !important; border-color: #ef4444 !important; box-shadow: 0 0 15px #ef4444; }
        .occupied-green { background: rgba(34, 197, 94, 0.6) !important; border-color: #22c55e !important; box-shadow: 0 0 15px #22c55e; }
        
        .active-task-pulse { animation: pulse-orange 1.5s infinite; }
        @keyframes pulse-orange { 
            0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(245, 158, 11, 0); }
            100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
        }

        .fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans pb-20">

    <header class="bg-slate-900 text-white p-5 shadow-2xl sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-map-location-dot text-2xl text-emerald-400"></i>
                <h1 class="text-2xl font-black italic tracking-tighter">邊跑邊逛・吃遍南投</h1>
            </div>
            <div class="flex items-center gap-6">
                <div class="flex gap-4">
                    <div class="flex items-center gap-2 text-xs font-bold"><span class="w-3 h-3 rounded bg-red-500"></span> 紅隊</div>
                    <div class="flex items-center gap-2 text-xs font-bold"><span class="w-3 h-3 rounded bg-green-500"></span> 綠隊</div>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4 md:p-8 space-y-10">
        
        <!-- 第一區：實體模擬地圖 -->
        <section class="bg-white rounded-[3.5rem] shadow-xl p-8 border border-slate-200 overflow-hidden">
            <div class="flex flex-col md:flex-row justify-between items-start gap-10">
                <!-- 左側：計分板 -->
                <div class="md:w-1/4 space-y-6">
                    <h2 class="text-3xl font-black text-slate-800">探索進度</h2>
                    <div class="grid grid-cols-1 gap-4">
                        <div class="bg-red-50 p-5 rounded-3xl border-2 border-red-100 shadow-sm">
                            <p class="text-[10px] font-black text-red-400 uppercase tracking-widest">Team Red</p>
                            <p class="text-4xl font-black text-red-600"><span id="score-red">0</span> <small class="text-xs text-slate-400">種食材</small></p>
                        </div>
                        <div class="bg-green-50 p-5 rounded-3xl border-2 border-green-100 shadow-sm">
                            <p class="text-[10px] font-black text-green-400 uppercase tracking-widest">Team Green</p>
                            <p class="text-4xl font-black text-green-600"><span id="score-green">0</span> <small class="text-xs text-slate-400">種食材</small></p>
                        </div>
                    </div>
                </div>

                <!-- 右側：真實地圖底圖 -->
                <div class="md:w-3/4 bg-slate-100 rounded-[3rem] p-4 relative flex justify-center items-center overflow-hidden" style="min-height: 550px;">
                    <!-- 載入您提供的地圖圖檔 -->
                    <img src="/api/files/image_a841bb.png" alt="南投行政區域圖" class="w-full h-auto max-w-[500px] shadow-2xl rounded-2xl">
                    
                    <!-- 透明互動層：手動對齊 13 鄉鎮點位 -->
                    <div id="township-overlays" class="absolute inset-0">
                        <!-- 點位由 JS 動態生成並根據座標擺放 -->
                    </div>
                </div>
            </div>
        </section>

        <!-- 第二區：隊伍路跑狀態 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- 紅隊 -->
            <div id="card-red" class="bg-white rounded-[3rem] p-8 shadow-lg border-b-[12px] border-red-500 transition-all">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-2xl font-black text-red-600 italic">TEAM RED</h3>
                    <div id="avatar-red" class="text-5xl">🏃‍♂️</div>
                </div>
                <div class="space-y-4">
                    <div class="flex justify-between text-sm font-bold text-slate-400">
                        <span>目前熱量累積</span>
                        <span><span id="steps-red">0</span> / 10 步</span>
                    </div>
                    <div class="h-4 bg-slate-100 rounded-full overflow-hidden">
                        <div id="bar-red" class="h-full bg-red-500 transition-all duration-300" style="width: 0%"></div>
                    </div>
                </div>
                <button onclick="addStep('red')" class="w-full mt-8 bg-red-600 hover:bg-red-700 text-white font-black py-4 rounded-2xl shadow-lg active:scale-95 transition-all text-xl">
                    加油快跑！
                </button>
            </div>

            <!-- 綠隊 -->
            <div id="card-green" class="bg-white rounded-[3rem] p-8 shadow-lg border-b-[12px] border-green-500 transition-all">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-2xl font-black text-green-600 italic">TEAM GREEN</h3>
                    <div id="avatar-green" class="text-5xl">🏃‍♀️</div>
                </div>
                <div class="space-y-4">
                    <div class="flex justify-between text-sm font-bold text-slate-400">
                        <span>目前熱量累積</span>
                        <span><span id="steps-green">0</span> / 10 步</span>
                    </div>
                    <div class="h-4 bg-slate-100 rounded-full overflow-hidden">
                        <div id="bar-green" class="h-full bg-green-500 transition-all duration-300" style="width: 0%"></div>
                    </div>
                </div>
                <button onclick="addStep('green')" class="w-full mt-8 bg-green-600 hover:bg-green-700 text-white font-black py-4 rounded-2xl shadow-lg active:scale-95 transition-all text-xl">
                    努力奔跑！
                </button>
            </div>
        </div>

        <!-- 第三區：智慧食材看板 (任務觸發後) -->
        <section id="infoPanel" class="hidden fade-in">
            <div class="bg-white rounded-[4rem] p-10 md:p-14 shadow-2xl border-4 border-emerald-100 relative">
                <div class="flex flex-col lg:flex-row gap-12 items-center">
                    <!-- 食材圖片 -->
                    <div class="w-full lg:w-1/3 flex flex-col items-center">
                        <div class="w-72 h-72 bg-slate-50 rounded-[3.5rem] flex items-center justify-center text-9xl shadow-inner border-8 border-white mb-6 overflow-hidden" id="foodImg">
                            ❓
                        </div>
                        <h2 class="text-4xl font-black text-slate-800" id="foodName">美味補給中...</h2>
                    </div>

                    <!-- 三大資訊與凱比 -->
                    <div class="w-full lg:w-2/3 space-y-6">
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                            <!-- 特色 -->
                            <div class="bg-blue-50 p-6 rounded-3xl border-2 border-blue-100">
                                <div class="flex items-center gap-2 mb-3 text-blue-500">
                                    <i class="fa-solid fa-star"></i> <span class="text-xs font-black uppercase">產品特色</span>
                                </div>
                                <p id="foodFeature" class="text-sm font-bold text-slate-700">請在地圖上選擇你喜歡的食材...</p>
                            </div>
                            <!-- 碳排 -->
                            <div class="bg-emerald-50 p-6 rounded-3xl border-2 border-emerald-100">
                                <div class="flex items-center gap-2 mb-3 text-emerald-500">
                                    <i class="fa-solid fa-leaf"></i> <span class="text-xs font-black uppercase">低碳里程</span>
                                </div>
                                <p id="foodCarbon" class="text-sm font-bold text-slate-700">-</p>
                            </div>
                            <!-- 過敏 -->
                            <div id="allergenBox" class="bg-slate-50 p-6 rounded-3xl border-2 border-slate-100">
                                <div class="flex items-center gap-2 mb-3 text-slate-400">
                                    <i class="fa-solid fa-shield-halved"></i> <span class="text-xs font-black uppercase">食安提醒</span>
                                </div>
                                <p id="foodAllergen" class="text-sm font-bold text-slate-700">-</p>
                            </div>
                        </div>

                        <div class="bg-slate-900 text-white p-6 rounded-3xl flex items-start gap-5 shadow-xl relative">
                            <div class="text-4xl">🤖</div>
                            <div>
                                <p class="text-xs font-bold text-emerald-400 mb-1 tracking-widest">南投食農大使・凱比</p>
                                <p id="foodStory" class="text-lg font-medium leading-relaxed italic">「哇！跑了 10 步真不簡單，趕快選一個南投美食來補給體力吧！」</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- 獲勝模態框 -->
    <div id="winModal" class="fixed inset-0 bg-slate-900/90 backdrop-blur-md z-[100] hidden items-center justify-center p-6">
        <div class="bg-white rounded-[4rem] p-16 max-w-xl w-full text-center shadow-2xl">
            <div class="text-[10rem] mb-10">🏃‍♂️🏆</div>
            <h2 id="winTitle" class="text-5xl font-black text-slate-800 mb-4">跑旅挑戰成功！</h2>
            <p id="winStats" class="text-slate-500 text-2xl font-bold mb-10"></p>
            <button onclick="location.reload()" class="bg-emerald-500 text-white px-16 py-6 rounded-[2rem] font-black text-2xl shadow-lg hover:scale-110 transition">再玩一局</button>
        </div>
    </div>

    <script>
        // --- 1. 13 鄉鎮資料庫 (補齊為您的 13 個行政區) ---
        const townships = [
            { name: "草屯鎮", x: 26, y: 35, size: 40 },
            { name: "南投市", x: 17, y: 40, size: 35 },
            { name: "名間鄉", x: 17, y: 50, size: 35 },
            { name: "竹山鎮", x: 18, y: 70, size: 50 },
            { name: "鹿谷鄉", x: 28, y: 65, size: 40 },
            { name: "集集鎮", x: 30, y: 52, size: 30 },
            { name: "中寮鄉", x: 35, y: 43, size: 40 },
            { name: "水里鄉", x: 42, y: 55, size: 40 },
            { name: "信義鄉", x: 65, y: 75, size: 80 },
            { name: "魚池鄉", x: 55, y: 45, size: 40 },
            { name: "埔里鎮", x: 58, y: 32, size: 45 },
            { name: "國姓鄉", x: 45, y: 24, size: 45 },
            { name: "仁愛鄉", x: 75, y: 25, size: 80 }
        ];

        const database = {
            '草屯鎮': { icon: '🍡', food: '草屯手工麻糬', feature: '手工揉製，糯米香Q。', carbon: '🌱 低里程米食', allergen: '🔴 含有花生、糯米', story: '草屯的麻糬是南投人的驕傲！不過會對花生過敏的小朋友，要小心這款好吃的補給喔！' },
            '南投市': { icon: '🍜', food: '南投意麵', feature: '傳統曬製，口感彈牙。', carbon: '🌱 在地手作', allergen: '🟡 含有小麥', story: '跑累了嗎？來一碗暖呼呼的南投意麵，這可是南投市最道地的味道！' },
            '名間鄉': { icon: '🍍', food: '名間鳳梨', feature: '紅土高原產，甜中帶微酸。', carbon: '🌱 減碳直送', allergen: '🟢 天然酵素', story: '名間鄉的紅土種出來的鳳梨超級甜！滿滿的酵素對腸胃很好喔。' },
            '竹山鎮': { icon: '🍠', food: '紅土地瓜', feature: '鬆軟綿密，纖維豐富。', carbon: '🌱 減碳 96%', allergen: '🟢 優質原型澱粉', story: '竹山的地瓜是世界級的！在地種植幫地球省下好多力氣，我們大家一起給小農按個讚吧！' },
            '鹿谷鄉': { icon: '🍵', food: '凍頂烏龍茶', feature: '焙火回甘，喉韻悠長。', carbon: '🌱 低里程配送', allergen: '🟢 天然無敏', story: '鹿谷山上清晨採收的茶葉，喝一口回甘一整天，讓你跑起來更有活力！' },
            '集集鎮': { icon: '🍌', food: '集集山蕉', feature: '曾為天皇貢品，香氣濃郁。', carbon: '🌱 友善栽種', allergen: '🟢 豐富鉀離子', story: '集集山蕉口感超級Q彈！以前可是專門送給日本天皇吃的補給品呢。' },
            '中寮鄉': { icon: '🍯', food: '龍眼蜂蜜', feature: '純淨蜜源，香醇厚實。', carbon: '🌱 低里程蜜源', allergen: '🟡 嬰幼兒忌食', story: '中寮的蜜蜂好勤勞！但要記得一歲以下的小Baby腸胃還沒長大，不可以吃蜂蜜喔。' },
            '水里鄉': { icon: '梅', food: '水里脆梅', feature: '生津止渴，果肉脆爽。', carbon: '🌱 傳統古法', allergen: '🟢 天然果實', story: '酸酸甜甜的水里脆梅，最適合路跑完解渴了，口水都快流出來啦！' },
            '信義鄉': { icon: '🍇', food: '巨峰葡萄', feature: '高山低溫孕育，飽滿鮮甜。', carbon: '🌱 減碳採收', allergen: '🟢 安全無敏', story: '信義鄉的葡萄像黑寶石一樣又黑又甜！連皮吃營養價值最高喔。' },
            '魚池鄉': { icon: '🫖', food: '日月潭紅茶', feature: '帶有天然薄荷與肉桂香。', carbon: '🌱 契作低碳', allergen: '🟢 天然茶葉', story: '在日月潭湖畔長大的紅茶，喝起來有淡淡的香氣，是全世界遊客最愛的味道。' },
            '埔里鎮': { icon: '🥬', food: '茭白筍', feature: '質地脆嫩，有美人腿美稱。', carbon: '🌱 湧泉灌溉', allergen: '🟢 高纖安全', story: '埔里的水最乾淨了，種出來的茭白筍不用加鹽巴就非常甜喔！' },
            '國姓鄉': { icon: '☕', food: '國姓咖啡', feature: '本土精品豆，帶柑橘香。', carbon: '🌱 低里程烘焙', allergen: '🟢 咖啡因注意', story: '國姓鄉海拔高、空氣好，種出來的咖啡豆香氣完全不輸給外國人喔！' },
            '仁愛鄉': { icon: '🍄', food: '高山香菇', feature: '森林環境生長，香氣撲鼻。', carbon: '🌱 低里程林產', allergen: '🟢 天然高蛋白', story: '長在仁愛鄉深山裡的香菇，吸飽了山裡的芬多精，煮湯最有營養了！' }
        };

        // --- 2. 遊戲狀態 ---
        let state = {
            red: { steps: 0, count: 0 },
            green: { steps: 0, count: 0 },
            occupied: {}, // townName: 'red' or 'green'
            activeTeam: null,
            total: 0
        };

        // --- 3. 核心邏輯 ---
        function initMap() {
            const container = document.getElementById('township-overlays');
            townships.forEach(t => {
                const div = document.createElement('div');
                div.id = `town-${t.name}`;
                div.className = "township-overlay";
                div.style.left = `${t.x}%`;
                div.style.top = `${t.y}%`;
                div.style.width = `${t.size}px`;
                div.style.height = `${t.size}px`;
                div.style.transform = "translate(-50%, -50%)";
                div.onclick = () => handleMapClick(t.name);
                container.appendChild(div);
            });
        }

        function addStep(team) {
            if (state.activeTeam) return;

            state[team].steps++;
            updatePlayerUI(team);

            if (state[team].steps >= 10) {
                state.activeTeam = team;
                triggerTask(team);
            }
        }

        function triggerTask(team) {
            const ui = document.getElementById('infoPanel');
            ui.classList.remove('hidden');
            
            document.getElementById(`card-${team}`).classList.add('active-task-pulse');
            document.getElementById('foodName').innerText = "等待選擇食材...";
            document.getElementById('foodStory').innerText = `太棒了！跑完了 10 步！${team==='red'?'紅隊':'綠隊'}的小跑友，請在地圖上選一個你喜歡的南投食材吧！`;
            
            speak(`太棒了！跑完了 10 步！${team==='red'?'紅隊':'綠隊'}的小朋友，請在地圖上選擇你喜歡的補給食材吧！`);
            window.scrollTo({ top: ui.offsetTop - 50, behavior: 'smooth' });
        }

        function handleMapClick(townName) {
            if (!state.activeTeam) return;
            if (state.occupied[townName]) return;

            const team = state.activeTeam;
            const data = database[townName];

            // 1. 紀錄領地
            state.occupied[townName] = team;
            state[team].count++;
            state.total++;

            // 2. 更新地圖視覺
            const div = document.getElementById(`town-${townName}`);
            div.classList.add(team === 'red' ? 'occupied-red' : 'occupied-green');

            // 3. 更新資訊卡
            updateFoodUI(townName, data);

            // 4. 語音導覽
            speak(`你選到了${townName}的${data.food}！${data.story}`);

            // 5. 更新分數
            document.getElementById(`score-${team}`).innerText = state[team].count;
            document.getElementById('score-remain').innerText = 13 - state.total;

            // 6. 重置狀態
            setTimeout(() => {
                document.getElementById(`card-${team}`).classList.remove('active-task-pulse');
                document.getElementById('infoPanel').classList.add('hidden');
                state[team].steps = 0;
                state.activeTeam = null;
                updatePlayerUI(team);

                if (state.total >= 13) endGame();
            }, 8000);
        }

        function updateFoodUI(name, data) {
            document.getElementById('foodImg').innerText = data.icon;
            document.getElementById('foodName').innerText = data.food;
            document.getElementById('foodFeature').innerText = data.feature;
            document.getElementById('foodCarbon').innerText = data.carbon;
            document.getElementById('foodAllergen').innerText = data.allergen;
            document.getElementById('foodStory').innerText = `「${data.story}」`;

            // 過敏提示變色
            const box = document.getElementById('allergenBox');
            if(data.allergen.includes('🔴')) box.className = "bg-red-50 p-6 rounded-3xl border-2 border-red-100";
            else if(data.allergen.includes('🟡')) box.className = "bg-yellow-50 p-6 rounded-3xl border-2 border-yellow-100";
            else box.className = "bg-green-50 p-6 rounded-3xl border-2 border-green-100";
        }

        function updatePlayerUI(team) {
            document.getElementById(`steps-${team}`).innerText = state[team].steps;
            const bar = document.getElementById(`bar-${team}`);
            bar.style.width = `${(state[team].steps / 10) * 100}%`;

            const avatar = document.getElementById(`avatar-${team}`);
            if (state[team].steps > 0 && !state.activeTeam) {
                avatar.classList.add('running');
            } else {
                avatar.classList.remove('running');
            }
        }

        function speak(text) {
            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'zh-TW';
            utter.pitch = 1.1; // 稍微拉高音調，聽起來比較像凱比
            utter.rate = 0.95; // 語速稍微放慢一點點，更親切
            window.speechSynthesis.speak(utter);
        }

        function endGame() {
            const winner = state.red.count > state.green.count ? '紅隊' : '綠隊';
            document.getElementById('winTitle').innerText = `${winner} 是南投美食之王！`;
            document.getElementById('winStats').innerText = `恭喜跑遍了全南投，成功認識了 13 種低碳食材！`;
            document.getElementById('winModal').classList.remove('hidden');
            document.getElementById('winModal').classList.add('flex');
            speak(`恭喜大家！我們已經成功跑遍了整個南投，認識了 13 種好吃的低碳食材。今天的獲勝者是${winner}！大家都是最棒的食農小大使喔！`);
        }

        window.onload = initMap;
    </script>
</body>
</html>
