<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手機體感控制器</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>
body {
  font-family: "Microsoft JhengHei";
  text-align: center;
  background: #f5f5f5;
}
button {
  padding: 15px;
  margin: 10px;
  font-size: 18px;
  border-radius: 10px;
  border: none;
}
.red { background: #ef4444; color: white; }
.green { background: #16a34a; color: white; }
</style>
</head>

<body>

<h2>📱 手機體感控制器</h2>

<p id="status">MQTT 連線中...</p>

<button class="red" onclick="setTeam('red')">紅隊</button>
<button class="green" onclick="setTeam('green')">綠隊</button>

<br>

<button onclick="startSensor()">開始體感</button>
<button onclick="stopSensor()">停止體感</button>

<br>

<button onclick="sendStep()">手動送出一步</button>

<h1 id="counter">0</h1>

<script>
let team = "red";
let count = 0;
let lastTime = 0;
let running = false;

// ⭐ MQTTGO server
const client = mqtt.connect("wss://MQTTGO.io:8084/mqtt");

client.on("connect", () => {
  document.getElementById("status").innerText = "MQTT 已連線 ✅";
});

client.on("error", () => {
  document.getElementById("status").innerText = "MQTT 連線失敗 ❌";
});

// 選隊伍
function setTeam(t) {
  team = t;
  alert("目前隊伍：" + (t === "red" ? "紅隊" : "綠隊"));
}

// 發送步數
function sendStep() {
  const topic = "nantou-food-race/" + team;
  const payload = {
    team: team,
    step: 1,
    time: Date.now()
  };

  client.publish(topic, JSON.stringify(payload));
  count++;
  document.getElementById("counter").innerText = count;
}

// 開始體感
function startSensor() {
  running = true;

  if (typeof DeviceMotionEvent !== "undefined" &&
      typeof DeviceMotionEvent.requestPermission === "function") {

    DeviceMotionEvent.requestPermission().then(permissionState => {
      if (permissionState === "granted") {
        window.addEventListener("devicemotion", handleMotion);
      } else {
        alert("需要允許感測器");
      }
    });

  } else {
    window.addEventListener("devicemotion", handleMotion);
  }
}

// 停止
function stopSensor() {
  running = false;
  window.removeEventListener("devicemotion", handleMotion);
}

// 判定晃動
function handleMotion(event) {
  if (!running) return;

  const acc = event.accelerationIncludingGravity;
  if (!acc) return;

  const total = Math.abs(acc.x) + Math.abs(acc.y) + Math.abs(acc.z);

  const now = Date.now();

  if (total > 25 && now - lastTime > 400) {
    lastTime = now;
    sendStep();
  }
}
</script>

</body>
</html>
