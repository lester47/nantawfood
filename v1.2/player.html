<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>手機體感控制器｜南投食農領地戰 v1.2</title>
  <meta name="theme-color" content="#2f855a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="食農控制器" />
  <link rel="manifest" href="./manifest.json" />
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    :root {
      --red: #ef4444;
      --green: #16a34a;
      --gold: #f59e0b;
      --ink: #263527;
      --paper: #fffdf4;
      --line: #e7dcc2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 20% 0%, rgba(255,224,128,.65), transparent 36%),
        linear-gradient(135deg, #f8f1dc, #eff7e5 56%, #eaf6ff);
      padding: 18px;
    }
    .app {
      max-width: 560px;
      margin: auto;
    }
    .hero {
      background: rgba(38,53,39,.95);
      color: white;
      border-radius: 30px;
      padding: 22px;
      box-shadow: 0 20px 42px rgba(0,0,0,.18);
    }
    .hero h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 1000;
      letter-spacing: -.04em;
    }
    .hero p {
      margin: 8px 0 0;
      color: #d8f3dc;
      font-weight: 900;
      line-height: 1.6;
    }
    .card {
      margin-top: 16px;
      background: rgba(255,253,244,.95);
      border: 1px solid var(--line);
      border-radius: 30px;
      padding: 20px;
      box-shadow: 0 18px 34px rgba(75,59,29,.14);
    }
    .status {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .pill {
      border-radius: 18px;
      padding: 12px;
      background: #f6f4e9;
      border: 1px solid var(--line);
      font-weight: 1000;
      text-align: center;
    }
    .pill.ok { background: #dcfce7; color: #166534; border-color: #86efac; }
    .pill.bad { background: #fee2e2; color: #991b1b; border-color: #fecaca; }
    .team-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 14px;
    }
    button {
      border: 0;
      font-family: inherit;
      font-weight: 1000;
      cursor: pointer;
      transition: .16s;
    }
    .team-btn {
      padding: 18px;
      border-radius: 24px;
      color: white;
      font-size: 22px;
      box-shadow: 0 12px 22px rgba(0,0,0,.15);
      opacity: .72;
    }
    .team-btn.red { background: var(--red); }
    .team-btn.green { background: var(--green); }
    .team-btn.active {
      opacity: 1;
      outline: 5px solid #facc15;
      transform: scale(1.03);
    }
    .big-step {
      margin: 16px 0 10px;
      text-align: center;
      border-radius: 32px;
      padding: 28px 20px;
      background: #263527;
      color: white;
    }
    .big-step .num {
      font-size: 84px;
      line-height: 1;
      font-weight: 1000;
      color: #facc15;
    }
    .big-step .label {
      margin-top: 8px;
      font-size: 16px;
      font-weight: 1000;
      color: #d8f3dc;
    }
    .main-btn {
      width: 100%;
      padding: 18px;
      border-radius: 24px;
      background: var(--gold);
      color: white;
      font-size: 22px;
      box-shadow: 0 14px 24px rgba(245,158,11,.28);
      margin-top: 12px;
    }
    .main-btn.stop { background: #64748b; }
    .manual-btn {
      width: 100%;
      padding: 18px;
      border-radius: 24px;
      background: #315a24;
      color: white;
      font-size: 20px;
      margin-top: 12px;
    }
    .control-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 12px;
    }
    .small-btn {
      padding: 14px;
      border-radius: 18px;
      background: #f6f4e9;
      border: 1px solid var(--line);
      color: #7c4a00;
    }
    .meter {
      margin-top: 14px;
      background: #f6f4e9;
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 16px;
      font-weight: 900;
    }
    .meter-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .bar {
      height: 16px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
    }
    .bar i {
      display: block;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #f59e0b, #ef4444);
      border-radius: 999px;
      transition: width .1s;
    }
    label {
      display: block;
      font-weight: 1000;
      margin-top: 14px;
    }
    input[type="range"] { width: 100%; }
    .hint {
      font-size: 14px;
      line-height: 1.7;
      color: #5b6b56;
      font-weight: 800;
    }
    .log {
      max-height: 120px;
      overflow: auto;
      background: #111827;
      color: #d1fae5;
      padding: 12px;
      border-radius: 18px;
      font-size: 12px;
      line-height: 1.6;
      margin-top: 12px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="hero">
      <h1>📱 手機體感控制器</h1>
      <p>v1.2 單房間版｜選擇紅隊或綠隊，按下開始後，晃動手機即可透過 MQTT 推動主畫面前進。</p>
    </section>

    <section class="card">
      <div class="status">
        <div id="mqttStatus" class="pill bad">MQTT 未連線</div>
        <div id="sensorStatus" class="pill bad">感測器未啟動</div>
      </div>

      <div class="team-grid">
        <button id="redBtn" class="team-btn red active">🔴 紅隊</button>
        <button id="greenBtn" class="team-btn green">🟢 綠隊</button>
      </div>

      <div class="big-step">
        <div id="stepCount" class="num">0</div>
        <div id="teamLabel" class="label">目前控制：紅隊</div>
      </div>

      <button id="startBtn" class="main-btn">開始體感偵測</button>
      <button id="manualBtn" class="manual-btn">手動送出一步（備援）</button>

      <div class="control-row">
        <button id="resetBtn" class="small-btn">步數歸零</button>
        <button id="vibrateBtn" class="small-btn">震動測試</button>
      </div>
    </section>

    <section class="card">
      <div class="meter">
        <div class="meter-row">
          <span>目前晃動強度</span>
          <span id="motionValue">0.0</span>
        </div>
        <div class="bar"><i id="motionBar"></i></div>

        <label>判定門檻：<span id="thresholdValue">15</span></label>
        <input id="threshold" type="range" min="10" max="28" step="1" value="15">

        <label>冷卻時間：<span id="cooldownValue">420</span> ms</label>
        <input id="cooldown" type="range" min="250" max="900" step="10" value="420">
      </div>

      <p class="hint">
        建議測試方式：主畫面開在電腦或投影幕，手機開啟本頁。手機每偵測一步，主畫面紅隊或綠隊會前進一步。若感測太敏感，請調高門檻；若不容易計步，請調低門檻。
      </p>

      <div id="log" class="log">等待操作...</div>
    </section>
  </main>

  <script>
    const BROKER_URL = "wss://broker.mqttgo.io:8084/mqtt";
    const TOPICS = {
      red: "nantou-food-race/red",
      green: "nantou-food-race/green"
    };

    const $ = (id) => document.getElementById(id);

    const state = {
      team: "red",
      running: false,
      mqttReady: false,
      sensorReady: false,
      totalSteps: 0,
      lastStepAt: 0,
      client: null
    };

    function log(text) {
      const time = new Date().toLocaleTimeString();
      $("log").textContent = `[${time}] ${text}\n` + $("log").textContent;
      console.log("[手機體感控制器]", text);
    }

    function setTeam(team) {
      state.team = team;
      $("redBtn").classList.toggle("active", team === "red");
      $("greenBtn").classList.toggle("active", team === "green");
      $("teamLabel").textContent = `目前控制：${team === "red" ? "紅隊" : "綠隊"}`;
    }

    function setStatus(id, text, ok) {
      const el = $(id);
      el.textContent = text;
      el.classList.toggle("ok", ok);
      el.classList.toggle("bad", !ok);
    }

    function updateStepUI() {
      $("stepCount").textContent = state.totalSteps;
    }

    function sendStep() {
      if (!state.mqttReady || !state.client) {
        log("MQTT 尚未連線，無法送出步數");
        return;
      }

      state.totalSteps += 1;
      updateStepUI();

      const payload = {
        team: state.team,
        steps: 1,
        totalSteps: state.totalSteps,
        timestamp: Date.now(),
        mode: "mobile"
      };

      state.client.publish(TOPICS[state.team], JSON.stringify(payload), { qos: 0, retain: false });
      log(`${state.team === "red" ? "紅隊" : "綠隊"}送出一步，累計 ${state.totalSteps}`);
      if (navigator.vibrate) navigator.vibrate(35);
    }

    function connectMqtt() {
      if (typeof mqtt === "undefined") {
        setStatus("mqttStatus", "MQTT 套件未載入", false);
        log("mqtt.js 未載入，請確認網路連線");
        return;
      }

      const clientId = "nantou-player-" + Math.random().toString(16).slice(2);
      state.client = mqtt.connect(BROKER_URL, {
        clientId,
        clean: true,
        reconnectPeriod: 2000,
        connectTimeout: 8000
      });

      state.client.on("connect", () => {
        state.mqttReady = true;
        setStatus("mqttStatus", "MQTT 已連線", true);
        log("MQTT 已連線，可以開始傳送步數");
      });

      state.client.on("reconnect", () => {
        state.mqttReady = false;
        setStatus("mqttStatus", "MQTT 重連中", false);
      });

      state.client.on("offline", () => {
        state.mqttReady = false;
        setStatus("mqttStatus", "MQTT 離線", false);
      });

      state.client.on("error", (err) => {
        state.mqttReady = false;
        setStatus("mqttStatus", "MQTT 錯誤", false);
        log("MQTT 錯誤：" + err.message);
      });
    }

    async function requestMotionPermission() {
      try {
        if (typeof DeviceMotionEvent !== "undefined" &&
            typeof DeviceMotionEvent.requestPermission === "function") {
          const result = await DeviceMotionEvent.requestPermission();
          if (result !== "granted") {
            setStatus("sensorStatus", "感測器未授權", false);
            log("iOS 感測器授權未通過");
            return false;
          }
        }
        setStatus("sensorStatus", "感測器已啟動", true);
        state.sensorReady = true;
        return true;
      } catch (err) {
        setStatus("sensorStatus", "感測器啟動失敗", false);
        log("感測器啟動失敗：" + err.message);
        return false;
      }
    }

    function handleMotion(event) {
      if (!state.running) return;

      const acc = event.accelerationIncludingGravity || event.acceleration || {};
      const x = acc.x || 0;
      const y = acc.y || 0;
      const z = acc.z || 0;
      const magnitude = Math.sqrt(x * x + y * y + z * z);

      $("motionValue").textContent = magnitude.toFixed(1);
      $("motionBar").style.width = Math.min(100, magnitude * 4) + "%";

      const threshold = Number($("threshold").value);
      const cooldown = Number($("cooldown").value);
      const now = Date.now();

      if (magnitude >= threshold && now - state.lastStepAt >= cooldown) {
        state.lastStepAt = now;
        sendStep();
      }
    }

    async function startMotion() {
      if (!state.running) {
        const ok = await requestMotionPermission();
        if (!ok) return;

        state.running = true;
        $("startBtn").textContent = "停止體感偵測";
        $("startBtn").classList.add("stop");
        window.addEventListener("devicemotion", handleMotion);
        log("體感偵測開始");
      } else {
        state.running = false;
        $("startBtn").textContent = "開始體感偵測";
        $("startBtn").classList.remove("stop");
        window.removeEventListener("devicemotion", handleMotion);
        log("體感偵測停止");
      }
    }

    $("redBtn").onclick = () => setTeam("red");
    $("greenBtn").onclick = () => setTeam("green");
    $("startBtn").onclick = startMotion;
    $("manualBtn").onclick = sendStep;
    $("resetBtn").onclick = () => {
      state.totalSteps = 0;
      updateStepUI();
      log("手機端步數已歸零");
    };
    $("vibrateBtn").onclick = () => {
      if (navigator.vibrate) navigator.vibrate([80, 50, 80]);
      log("震動測試");
    };
    $("threshold").oninput = () => $("thresholdValue").textContent = $("threshold").value;
    $("cooldown").oninput = () => $("cooldownValue").textContent = $("cooldown").value;

    connectMqtt();
    setTeam("red");
  </script>
</body>
</html>
