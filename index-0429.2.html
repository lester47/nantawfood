<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>南投環線：低碳食材跑旅大賽</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @keyframes run-animation { 0% { transform: translateY(0); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0); } }
        .running { animation: run-animation 0.4s infinite; }
        
        /* 地圖點位樣式 */
        .town-node { transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .node-active { filter: drop-shadow(0 0 8px rgba(16, 185, 129, 0.8)); }
        
        /* 跑者圖示樣式 */
        .player-marker { 
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.2));
            transition: all 0.6s ease-in-out;
            z-index: 50;
        }
        
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* 地圖背景風格 */
        .map-bg {
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans">

    <!-- 頂部狀態列 -->
    <header class="bg-slate-900 text-white p-4 shadow-lg sticky top-0 z-50">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-map-location-dot text-2xl text-green-400"></i>
                <h1 class="text-xl font-bold tracking-tight">南投環線：低碳食材跑旅</h1>
            </div>
            <div class="flex gap-4 items-center">
                <div id="connectionStatus" class="text-xs bg-red-900 px-3 py-1 rounded-full border border-red-700">
                    <i class="fa-solid fa-link-slash mr-1"></i> 未連線 micro:bit
                </div>
                <button onclick="toggleAdmin()" class="hover:text-green-400"><i class="fa-solid fa-gear text-xl"></i></button>
            </div>
        </div>
    </header>

    <!-- 南投 13 鄉鎮實體模擬地圖 -->
    <div class="bg-white border-b border-slate-200 p-4 md:p-8 overflow-hidden">
        <div class="max-w-4xl mx-auto relative map-bg rounded-3xl border border-slate-100 shadow-inner" style="height: 500px;">
            <!-- 地圖標題 -->
            <div class="absolute top-4 left-6 z-10">
                <h3 class="text-slate-400 font-black text-sm uppercase tracking-widest">Nantou Race Map</h3>
                <p class="text-slate-300 text-[10px]">13 Townships Virtual Circuit</p>
            </div>

            <!-- SVG 路線連結 (裝飾用) -->
            <svg class="absolute inset-0 w-full h-full pointer-events-none" id="mapLines">
                <!-- 線條會由 JS 根據座標動態生成 -->
            </svg>

            <!-- 鄉鎮點位容器 -->
            <div id="mapNodesContainer" class="absolute inset-0">
                <!-- 點位由 JS 生成 -->
            </div>

            <!-- 跑者圖示 (地圖上的 Marker) -->
            <div id="marker-red" class="player-marker absolute w-10 h-10 flex items-center justify-center text-3xl" style="left: 0; top: 0; transform: translate(-50%, -50%);">🏃‍♂️</div>
            <div id="marker-green" class="player-marker absolute w-10 h-10 flex items-center justify-center text-3xl" style="left: 0; top: 0; transform: translate(-50%, -50%);">🏃‍♀️</div>
        </div>
    </div>

    <main class="max-w-5xl mx-auto p-4 md:p-8 space-y-8">
        
        <!-- 跑者計分與任務按鈕 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- 紅隊面板 -->
            <div id="card-red" class="bg-white rounded-3xl p-6 shadow-md border-b-8 border-red-500 transition-all">
                <div class="flex justify-between items-center mb-4">
                    <div class="flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full bg-red-500 animate-pulse"></span>
                        <h2 class="text-2xl font-black text-red-600 italic">TEAM RED</h2>
                    </div>
                    <span class="text-xs bg-red-50 text-red-700 px-3 py-1 rounded-full font-bold border border-red-100">
                        📍 <span id="pos-red">南投市</span>
                    </span>
                </div>
                <div class="flex items-center gap-6">
                    <div class="flex-1">
                        <div class="text-xs text-slate-400 font-bold uppercase mb-1">累積步數</div>
                        <div class="text-5xl font-black text-slate-800"><span id="steps-red">0</span> <small class="text-base text-slate-300 font-normal">STEPS</small></div>
                    </div>
                    <div class="w-20 h-20 bg-red-50 rounded-2xl flex items-center justify-center border-2 border-red-100">
                         <div id="ui-avatar-red" class="text-4xl">🏃‍♂️</div>
                    </div>
                </div>
                <div class="mt-6 grid grid-cols-2 gap-3">
                    <button onclick="addSteps('red')" class="bg-red-600 hover:bg-red-700 text-white font-bold py-4 rounded-2xl shadow-lg transition active:scale-95 flex flex-col items-center">
                        <span class="text-xs opacity-80 mb-1">手動模擬</span>
                        <span>跑 1 步</span>
                    </button>
                    <button id="task-red" disabled class="bg-slate-100 text-slate-400 font-bold py-4 rounded-2xl cursor-not-allowed border-2 border-transparent">
                        等待任務...
                    </button>
                </div>
            </div>

            <!-- 綠隊面板 -->
            <div id="card-green" class="bg-white rounded-3xl p-6 shadow-md border-b-8 border-green-500 transition-all">
                <div class="flex justify-between items-center mb-4">
                    <div class="flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full bg-green-500 animate-pulse"></span>
                        <h2 class="text-2xl font-black text-green-600 italic">TEAM GREEN</h2>
                    </div>
                    <span class="text-xs bg-green-50 text-green-700 px-3 py-1 rounded-full font-bold border border-green-100">
                        📍 <span id="pos-green">南投市</span>
                    </span>
                </div>
                <div class="flex items-center gap-6">
                    <div class="flex-1">
                        <div class="text-xs text-slate-400 font-bold uppercase mb-1">累積步數</div>
                        <div class="text-5xl font-black text-slate-800"><span id="steps-green">0</span> <small class="text-base text-slate-300 font-normal">STEPS</small></div>
                    </div>
                    <div class="w-20 h-20 bg-green-50 rounded-2xl flex items-center justify-center border-2 border-green-100">
                         <div id="ui-avatar-green" class="text-4xl">🏃‍♀️</div>
                    </div>
                </div>
                <div class="mt-6 grid grid-cols-2 gap-3">
                    <button onclick="addSteps('green')" class="bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-2xl shadow-lg transition active:scale-95 flex flex-col items-center">
                        <span class="text-xs opacity-80 mb-1">手動模擬</span>
                        <span>跑 1 步</span>
                    </button>
                    <button id="task-green" disabled class="bg-slate-100 text-slate-400 font-bold py-4 rounded-2xl cursor-not-allowed border-2 border-transparent">
                        等待任務...
                    </button>
                </div>
            </div>
        </div>

        <!-- 任務回饋區 (凱比導覽) -->
        <section id="feedbackArea" class="hidden fade-in">
            <div class="bg-white rounded-[2.5rem] shadow-2xl p-8 md:p-12 border-4 border-orange-100 relative overflow-hidden">
                <div class="absolute -top-6 -right-6 w-32 h-32 bg-orange-400 rotate-45 opacity-10"></div>
                
                <div class="flex flex-col lg:flex-row gap-10 items-center">
                    <!-- 食材圖示與掃描線 -->
                    <div class="relative">
                        <div class="w-40 h-40 bg-slate-50 rounded-full flex items-center justify-center text-8xl shadow-inner border-4 border-white" id="foodIcon">❓</div>
                        <div class="absolute inset-0 border-4 border-orange-400 rounded-full animate-ping opacity-20"></div>
                    </div>

                    <div class="flex-1 space-y-6">
                        <div class="text-center lg:text-left">
                            <div class="inline-block bg-orange-100 text-orange-600 text-xs font-black px-3 py-1 rounded-full mb-3 tracking-widest uppercase">RFID Task Active</div>
                            <h3 id="foodTitle" class="text-4xl font-black text-slate-800">請讀取食材卡片</h3>
                            <p id="foodLocation" class="text-slate-400 font-bold mt-1 text-lg italic"></p>
                        </div>
                        
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                            <div class="bg-slate-50 p-5 rounded-3xl border-2 border-slate-100 flex flex-col items-center text-center">
                                <i class="fa-solid fa-leaf text-green-500 mb-2"></i>
                                <span class="text-[10px] font-bold text-slate-400 uppercase">Carbon Data</span>
                                <p id="foodCarbon" class="font-black text-slate-700">等待中</p>
                            </div>
                            <div id="allergenBox" class="bg-slate-50 p-5 rounded-3xl border-2 border-slate-100 flex flex-col items-center text-center transition-colors">
                                <i class="fa-solid fa-shield-virus text-slate-400 mb-2" id="allergenIcon"></i>
                                <span class="text-[10px] font-bold text-slate-400 uppercase">Food Safety</span>
                                <p id="foodAllergen" class="font-black text-slate-700">等待中</p>
                            </div>
                            <div class="bg-slate-50 p-5 rounded-3xl border-2 border-slate-100 flex flex-col items-center text-center">
                                <i class="fa-solid fa-quote-left text-blue-500 mb-2"></i>
                                <span class="text-[10px] font-bold text-slate-400 uppercase">Story</span>
                                <p id="foodIntro" class="text-xs font-bold text-slate-500">待感應</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 模擬觸發按鈕 -->
                <div id="rfidSimulator" class="mt-10 pt-8 border-t border-slate-100">
                    <p class="text-center text-[10px] font-black text-slate-300 uppercase tracking-[0.3em] mb-6">Demo / Simulator Mode</p>
                    <div id="foodGrid" class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-5 gap-3"></div>
                </div>
            </div>
        </section>

    </main>

    <script>
        // --- 1. 地理座標設定 (模擬南投地圖 13 鄉鎮) ---
        // 座標以 500x500 為比例
        const townships = [
            { name: "南投市", x: 15, y: 35 },
            { name: "埔里鎮", x: 55, y: 30 },
            { name: "草屯鎮", x: 25, y: 15 },
            { name: "竹山鎮", x: 15, y: 80 },
            { name: "集集鎮", x: 30, y: 55 },
            { name: "名間鄉", x: 15, y: 50 },
            { name: "鹿谷鄉", x: 25, y: 70 },
            { name: "中寮鄉", x: 35, y: 40 },
            { name: "魚池鄉", x: 55, y: 45 },
            { name: "國姓鄉", x: 45, y: 15 },
            { name: "水里鄉", x: 45, y: 60 },
            { name: "信義鄉", x: 75, y: 75 },
            { name: "仁愛鄉", x: 80, y: 25 }
        ];

        // --- 2. 食農資料庫 ---
        const database = {
            'P01': { icon: '🍠', title: '竹山紅土地瓜', allergen: '🟢 安全無敏', carbon: '🌱 減碳 96%', story: '竹山特有的紅土讓地瓜特別鬆軟，是馬拉松補給的最佳能量！' },
            'P02': { icon: '🍡', title: '草屯手工麻糬', allergen: '🔴 含花生糯米', carbon: '🌱 在地米材', story: '草屯盛產優質米，手工麻糬Q彈有力，過敏體質請注意花生喔！' },
            'P03': { icon: '🍵', title: '鹿谷凍頂茶', allergen: '🟢 天然無敏', carbon: '🌱 低碳烘焙', story: '高山冷涼氣候醞釀的回甘茶味，是南投引以為傲的滋味。' },
            'P04': { icon: '🍍', title: '鳳梨酥', allergen: '🔴 含蛋與小麥', carbon: '🌱 契作鳳梨', story: '選用在地土鳳梨，每一口都吃得到南投陽光的味道。' },
            'P05': { icon: '🍇', title: '信義巨峰葡萄', allergen: '🟢 安全無敏', carbon: '🌱 高山採集', story: '信義鄉海拔高溫差大，讓葡萄像黑寶石一樣又黑又甜。' },
            'P06': { icon: '🍯', title: '中寮龍眼蜜', allergen: '🟡 嬰兒忌食', carbon: '🌱 友善生態', story: '純淨無農藥的採蜜環境，保證了蜂蜜的香醇與安全。' },
            'P07': { icon: '🍄', title: '埔里鮮香菇', allergen: '🟢 天然無敏', carbon: '🌱 段木栽培', story: '埔里湧泉灌溉出的香菇，肉質肥厚，減碳更健康！' }
        };

        // --- 3. 遊戲邏輯與狀態 ---
        let gameState = {
            red: { steps: 0, currentTown: 0, targetTown: 0, isBusy: false },
            green: { steps: 0, currentTown: 0, targetTown: 0, isBusy: false },
            winner: null,
            activeTeam: null
        };

        // --- 4. 初始化地圖 ---
        function initMap() {
            const container = document.getElementById('mapNodesContainer');
            const svg = document.getElementById('mapLines');
            
            // 繪製連線
            let pathD = `M ${townships[0].x}% ${townships[0].y}%`;
            for(let i=1; i<townships.length; i++) {
                pathD += ` L ${townships[i].x}% ${townships[i].y}%`;
            }
            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute("d", pathD);
            path.setAttribute("fill", "none");
            path.setAttribute("stroke", "#e2e8f0");
            path.setAttribute("stroke-width", "4");
            path.setAttribute("stroke-dasharray", "8 8");
            svg.appendChild(path);

            // 繪製點位
            townships.forEach((t, i) => {
                const node = document.createElement('div');
                node.id = `node-${i}`;
                node.className = "town-node absolute w-6 h-6 bg-slate-200 rounded-full border-4 border-white shadow-sm flex items-center justify-center cursor-help";
                node.style.left = `${t.x}%`;
                node.style.top = `${t.y}%`;
                node.style.transform = "translate(-50%, -50%)";
                node.innerHTML = `<span class="absolute -bottom-6 text-[10px] font-bold text-slate-400 whitespace-nowrap">${t.name}</span>`;
                container.appendChild(node);
            });

            // 初始跑者位置
            updateMarker('red');
            updateMarker('green');
            document.getElementById('node-0').classList.add('bg-green-500', 'node-active');
        }

        // --- 5. 核心動作 ---
        function addSteps(team) {
            if (gameState[team].isBusy) return;

            gameState[team].steps++;
            document.getElementById(`steps-${team}`).innerText = gameState[team].steps;
            
            // 介面動畫
            const avatar = document.getElementById(`ui-avatar-${team}`);
            avatar.classList.add('running');
            setTimeout(() => avatar.classList.remove('running'), 400);

            // 每 10 步一個任務點
            if (gameState[team].steps > 0 && gameState[team].steps % 10 === 0) {
                startTask(team);
            }
        }

        function startTask(team) {
            gameState[team].isBusy = true;
            gameState.activeTeam = team;

            // UI 狀態改變
            const card = document.getElementById(`card-${team}`);
            card.classList.add('scale-105', 'ring-4', 'ring-orange-400', 'z-20');
            
            const btn = document.getElementById(`task-${team}`);
            btn.disabled = false;
            btn.classList.remove('bg-slate-100', 'text-slate-400');
            btn.classList.add('bg-orange-500', 'text-white', 'animate-bounce', 'border-orange-600');
            btn.innerText = "🚨 立即感應 RFID";

            // 展開導覽區
            const feedback = document.getElementById('feedbackArea');
            feedback.classList.remove('hidden');
            document.getElementById('foodTitle').innerText = `請 ${team === 'red' ? '紅隊' : '綠隊'} 進行任務`;
            document.getElementById('foodLocation').innerText = `目前進度：抵達 ${townships[gameState[team].currentTown].name}`;
            
            window.scrollTo({ top: feedback.offsetTop - 50, behavior: 'smooth' });
        }

        function selectFood(id) {
            if (!gameState.activeTeam) return;
            const team = gameState.activeTeam;
            const data = database[id];

            // 1. 更新導覽介面
            document.getElementById('foodIcon').innerText = data.icon;
            document.getElementById('foodTitle').innerText = data.title;
            document.getElementById('foodCarbon').innerText = data.carbon;
            document.getElementById('foodAllergen').innerText = data.allergen;
            document.getElementById('foodIntro').innerText = data.story;

            // 處理過敏原樣式
            const box = document.getElementById('allergenBox');
            const icon = document.getElementById('allergenIcon');
            if(data.allergen.includes('🔴')) {
                box.className = "bg-red-100 p-5 rounded-3xl border-2 border-red-200 flex flex-col items-center text-center";
                icon.className = "fa-solid fa-triangle-exclamation text-red-600 mb-2";
            } else if(data.allergen.includes('🟡')) {
                box.className = "bg-yellow-100 p-5 rounded-3xl border-2 border-yellow-200 flex flex-col items-center text-center";
                icon.className = "fa-solid fa-circle-exclamation text-yellow-600 mb-2";
            } else {
                box.className = "bg-green-100 p-5 rounded-3xl border-2 border-green-200 flex flex-col items-center text-center";
                icon.className = "fa-solid fa-shield-check text-green-600 mb-2";
            }

            // 2. 移動地圖跑者
            movePlayer(team);

            // 3. 語音導覽
            speak(`恭喜${team==='red'?'紅隊':'綠隊'}！選擇了${data.title}。${data.story}`);

            // 4. 重置狀態
            setTimeout(() => {
                const card = document.getElementById(`card-${team}`);
                card.classList.remove('scale-105', 'ring-4', 'ring-orange-400', 'z-20');
                const btn = document.getElementById(`task-${team}`);
                btn.disabled = true;
                btn.classList.add('bg-slate-100', 'text-slate-400');
                btn.classList.remove('bg-orange-500', 'text-white', 'animate-bounce');
                btn.innerText = "任務已完成";
                gameState[team].isBusy = false;
                gameState.activeTeam = null;
            }, 500);
        }

        function movePlayer(team) {
            gameState[team].currentTown++;
            if (gameState[team].currentTown >= townships.length) {
                showWinner(team);
                gameState[team].currentTown = 0;
            }
            
            document.getElementById(`pos-${team}`).innerText = townships[gameState[team].currentTown].name;
            updateMarker(team);
            
            // 地圖點亮
            document.querySelectorAll('.town-node').forEach(n => n.classList.remove('node-active', 'bg-green-500'));
            const activeNode = document.getElementById(`node-${gameState[team].currentTown}`);
            activeNode.classList.add('node-active', 'bg-green-500');
        }

        function updateMarker(team) {
            const marker = document.getElementById(`marker-${team}`);
            const town = townships[gameState[team].currentTown];
            // 紅綠稍微偏移避免重疊
            const offset = team === 'red' ? -2 : 2;
            marker.style.left = `${town.x + offset}%`;
            marker.style.top = `${town.y + offset}%`;
        }

        function speak(text) {
            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'zh-TW';
            utter.rate = 1.0;
            window.speechSynthesis.speak(utter);
        }

        function showWinner(team) {
            alert(`🏆 恭喜 ${team==='red'?'紅隊':'綠隊'} 成功跑遍南投 13 鄉鎮，獲得低碳跑旅冠軍！`);
        }

        function toggleAdmin() { document.getElementById('adminPanel').classList.toggle('hidden'); }

        // --- 初始化按鈕與地圖 ---
        window.onload = () => {
            initMap();
            const grid = document.getElementById('foodGrid');
            Object.keys(database).forEach(id => {
                const btn = document.createElement('button');
                btn.className = "bg-white border-2 border-slate-100 p-3 rounded-2xl text-xs hover:border-orange-400 transition shadow-sm font-bold flex items-center justify-center gap-2";
                btn.innerHTML = `<span>${database[id].icon}</span> <span class="truncate">${database[id].title}</span>`;
                btn.onclick = () => selectFood(id);
                grid.appendChild(btn);
            });
        };

        // --- Web Serial (連線實體 micro:bit) ---
        async function connectSerial() {
            try {
                const port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                document.getElementById('connectionStatus').className = "text-xs bg-green-700 px-3 py-1 rounded-full border border-green-500";
                document.getElementById('connectionStatus').innerHTML = '<i class="fa-solid fa-link mr-1"></i> micro:bit 已連線';
                readLoop(port);
            } catch(e) { console.error(e); }
        }

        async function readLoop(port) {
            const reader = port.readable.getReader();
            let buffer = "";
            while (true) {
                const { value, done } = await reader.read();
                if (done) break;
                buffer += new TextDecoder().decode(value);
                const lines = buffer.split("\n");
                buffer = lines.pop();
                for (let line of lines) {
                    let cmd = line.trim();
                    if(cmd === "STEP_RED") addSteps('red');
                    if(cmd === "STEP_GREEN") addSteps('green');
                    if(database[cmd]) selectFood(cmd);
                }
            }
        }
    </script>
</body>
</html>
