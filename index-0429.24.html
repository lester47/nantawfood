<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邊跑邊逛 吃遍南投 - 專業地理資訊系統版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @keyframes bounce-run { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        .running { animation: bounce-run 0.3s infinite; }
        
        #map-container { width: 100%; height: 100%; min-height: 550px; background: #f8fafc; border-radius: 2rem; overflow: hidden; position: relative; }
        
        .town { 
            fill: #e2e8f0; 
            stroke: #fff; 
            stroke-width: 1; 
            transition: all 0.3s ease; 
            pointer-events: none; 
            opacity: 0.5;
        }
        
        .town.selectable { 
            cursor: pointer; 
            pointer-events: auto; 
            opacity: 1;
            fill: #cbd5e1;
        }
        .town.selectable:hover { fill: #94a3b8; }
        
        .town.occupied-red { fill: #fca5a5 !important; stroke: #ef4444; stroke-width: 2; pointer-events: none; opacity: 1; }
        .town.occupied-green { fill: #86efac !important; stroke: #10b981; stroke-width: 2; pointer-events: none; opacity: 1; }
        
        .town-label { font-size: 11px; font-weight: 900; fill: #475569; pointer-events: none; text-shadow: 0 1px 2px white; }
        
        .active-task-area { border: 6px solid #f59e0b; box-shadow: 0 0 30px rgba(245, 158, 11, 0.3); }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .voice-bar { width: 3px; height: 10px; background: #f59e0b; animation: sound-wave 1s infinite ease-in-out; }
        @keyframes sound-wave { 0%, 100% { height: 5px; } 50% { height: 15px; } }
        
        .pointer-none { pointer-events: none !important; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .keyword { color: #e11d48; font-weight: 900; border-bottom: 2px solid #fda4af; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans pb-20">

    <!-- 模式選擇 -->
    <div id="startModal" class="fixed inset-0 bg-slate-900/95 backdrop-blur-xl z-[200] flex items-center justify-center p-6 text-center">
        <div class="bg-white rounded-[4rem] p-12 max-w-2xl w-full shadow-2xl border-4 border-emerald-500">
            <div class="text-6xl mb-6">🏃‍♂️</div>
            <h1 class="text-4xl font-black text-slate-800 mb-2">邊跑邊逛．吃遍南投</h1>
            <p class="text-slate-500 font-bold mb-10 text-lg">專業地理資訊展示系統</p>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <button onclick="initGame(7)" class="group bg-orange-50 hover:bg-orange-500 p-8 rounded-[3rem] border-2 border-orange-200 transition-all text-left">
                    <span class="bg-orange-500 text-white px-4 py-1 rounded-full text-xs font-black">複審版</span>
                    <h3 class="text-2xl font-black text-orange-600 group-hover:text-white mt-4">半馬模式 (7站)</h3>
                </button>
                <button onclick="initGame(13)" class="group bg-emerald-50 hover:bg-emerald-500 p-8 rounded-[3rem] border-2 border-emerald-200 transition-all text-left">
                    <span class="bg-emerald-500 text-white px-4 py-1 rounded-full text-xs font-black">完整版</span>
                    <h3 class="text-2xl font-black text-emerald-600 group-hover:text-white mt-4">全馬模式 (13站)</h3>
                </button>
            </div>
        </div>
    </div>

    <header class="bg-slate-900 text-white p-5 shadow-2xl sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-map-location-dot text-2xl text-emerald-400"></i>
                <h1 class="text-2xl font-black italic tracking-tighter">邊跑邊逛・吃遍南投</h1>
            </div>
            <div class="flex gap-4 text-xs font-bold">
                <div class="flex items-center gap-2"><span class="w-3 h-3 rounded bg-red-400"></span> 紅隊</div>
                <div class="flex items-center gap-2"><span class="w-3 h-3 rounded bg-green-400"></span> 綠隊</div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 md:p-8 space-y-10">
        <!-- 地圖與統計 -->
        <section class="bg-white rounded-[3.5rem] shadow-xl p-8 border border-slate-200 overflow-hidden">
            <div class="flex flex-col lg:flex-row justify-between items-stretch gap-10">
                <div class="lg:w-1/3 flex flex-col justify-between">
                    <h2 class="text-4xl font-black text-slate-800 mb-6">任務探索進度</h2>
                    <div class="space-y-4">
                        <div class="bg-red-50 p-5 rounded-3xl border-l-8 border-red-400 shadow-sm">
                            <p class="text-xs font-bold text-red-400 uppercase">紅隊獲得</p>
                            <p class="text-3xl font-black text-red-600"><span id="score-red">0</span> <small class="text-xs">種</small></p>
                        </div>
                        <div class="bg-green-50 p-5 rounded-3xl border-l-8 border-green-400 shadow-sm">
                            <p class="text-xs font-bold text-green-400 uppercase">綠隊獲得</p>
                            <p class="text-3xl font-black text-green-600"><span id="score-green">0</span> <small class="text-xs">種</small></p>
                        </div>
                        <div class="bg-orange-50 p-5 rounded-3xl border-l-8 border-orange-400 shadow-sm">
                            <p class="text-xs font-bold text-orange-400 uppercase">總進度</p>
                            <p class="text-3xl font-black text-orange-600"><span id="total-progress">0</span> / <span id="goal-label">13</span></p>
                        </div>
                    </div>
                </div>

                <div class="lg:w-2/3 bg-slate-100 rounded-3xl relative p-2 border shadow-inner overflow-hidden">
                    <div id="map-loading" class="absolute inset-0 flex items-center justify-center bg-white/90 z-50">
                        <p class="text-lg font-black text-slate-500 animate-pulse">正在加載地理資料...</p>
                    </div>
                    <div id="map-container">
                        <svg id="nantou-svg" class="w-full h-full"></svg>
                    </div>
                </div>
            </div>
        </section>

        <!-- 路跑控制 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div id="card-red" class="bg-white rounded-[3rem] p-8 shadow-lg border-b-[12px] border-red-500 transition-all">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-3xl font-black text-red-600">TEAM RED</h3>
                    <div id="avatar-red" class="text-5xl">🏃‍♂️</div>
                </div>
                <div class="space-y-4">
                    <div class="flex justify-between text-xs font-bold text-slate-400 uppercase"><span>Round Progress</span> <span><span id="steps-red">0</span> / 10</span></div>
                    <div class="h-5 bg-slate-100 rounded-full overflow-hidden shadow-inner">
                        <div id="bar-red" class="h-full bg-red-500 transition-all duration-300" style="width: 0%"></div>
                    </div>
                </div>
                <button id="btn-red" onclick="addStep('red')" class="w-full mt-6 bg-red-600 text-white font-black py-5 rounded-3xl shadow-lg active:scale-95 transition-all text-2xl disabled:bg-slate-200 disabled:text-slate-400">
                    開始跑步
                </button>
            </div>

            <div id="card-green" class="bg-white rounded-[3rem] p-8 shadow-lg border-b-[12px] border-green-500 transition-all">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-3xl font-black text-green-600">TEAM GREEN</h3>
                    <div id="avatar-green" class="text-5xl">🏃‍♀️</div>
                </div>
                <div class="space-y-4">
                    <div class="flex justify-between text-xs font-bold text-slate-400 uppercase"><span>Round Progress</span> <span><span id="steps-green">0</span> / 10</span></div>
                    <div class="h-5 bg-slate-100 rounded-full overflow-hidden shadow-inner">
                        <div id="bar-green" class="h-full bg-green-500 transition-all duration-300" style="width: 0%"></div>
                    </div>
                </div>
                <button id="btn-green" onclick="addStep('green')" class="w-full mt-6 bg-green-600 text-white font-black py-5 rounded-3xl shadow-lg active:scale-95 transition-all text-2xl disabled:bg-slate-200 disabled:text-slate-400">
                    開始跑步
                </button>
            </div>
        </div>

        <!-- 凱比看板 -->
        <section id="infoPanel" class="hidden fade-in">
            <div class="bg-white rounded-[4rem] p-10 shadow-2xl border-4 border-orange-100 relative">
                <div class="flex flex-col lg:flex-row gap-10 items-start">
                    <div class="w-full lg:w-1/3 flex flex-col items-center">
                        <div class="w-64 h-64 bg-slate-50 rounded-[3.5rem] flex items-center justify-center text-8xl shadow-inner border-8 border-white mb-6" id="foodImg">❓</div>
                        <h2 class="text-4xl font-black text-slate-800 text-center" id="foodName">凱比準備中...</h2>
                    </div>
                    <div class="w-full lg:w-2/3 space-y-6">
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                            <div class="bg-blue-50 p-6 rounded-3xl border-2 border-blue-100">
                                <div class="flex items-center gap-2 mb-3 text-blue-500 font-black text-xs uppercase"><i class="fa-solid fa-star"></i> 特色</div>
                                <p id="foodFeature" class="text-sm font-bold text-slate-700 leading-relaxed">-</p>
                            </div>
                            <div class="bg-emerald-50 p-6 rounded-3xl border-2 border-emerald-100">
                                <div class="flex items-center gap-2 mb-3 text-emerald-500 font-black text-xs uppercase"><i class="fa-solid fa-leaf"></i> 低碳</div>
                                <p id="foodCarbon" class="text-sm font-bold text-slate-700 leading-relaxed">-</p>
                            </div>
                            <div id="allergenBox" class="bg-slate-50 p-6 rounded-3xl border-2 border-slate-100">
                                <div class="flex items-center gap-2 mb-3 text-slate-400 font-black text-xs uppercase"><i class="fa-solid fa-shield-halved"></i> 食安</div>
                                <p id="foodAllergen" class="text-sm font-bold text-slate-700 leading-relaxed">-</p>
                            </div>
                        </div>
                        <div class="bg-orange-50 p-8 rounded-[2.5rem] border-2 border-orange-100">
                            <h4 class="text-orange-600 font-black text-sm uppercase mb-4 flex items-center gap-2"><i class="fa-solid fa-book-open"></i> 食農背景導覽</h4>
                            <div id="foodRichText" class="text-slate-600 text-sm md:text-base leading-loose font-medium h-40 overflow-y-auto custom-scroll">跑完 10 步後，地圖就會亮起...</div>
                        </div>
                        <div class="bg-slate-900 text-white p-7 rounded-3xl flex items-start gap-6 border-l-8 border-orange-500">
                            <div class="text-4xl">🤖</div>
                            <div class="flex-1">
                                <div class="flex items-center justify-between mb-2">
                                    <p class="text-xs font-bold text-orange-400 tracking-widest uppercase">Kebbi AI Guide</p>
                                    <div id="speakWaves" class="flex gap-1 hidden">
                                        <div class="voice-bar"></div><div class="voice-bar"></div><div class="voice-bar"></div>
                                    </div>
                                </div>
                                <p id="foodStory" class="text-lg font-medium leading-relaxed italic text-slate-100">請在地圖上選擇感興趣的補給食材。</p>
                                <!-- 手動急救按鈕 -->
                                <button id="skipVoiceBtn" onclick="manualUnlock()" class="hidden mt-2 text-xs text-orange-300 underline decoration-dotted">如果語音沒反應，請點此直接選擇地圖</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="winModal" class="fixed inset-0 bg-slate-900/90 backdrop-blur-md z-[100] hidden items-center justify-center p-6 text-center">
        <div class="bg-white rounded-[4rem] p-16 max-w-xl w-full shadow-2xl border-4 border-emerald-500">
            <div class="text-9xl mb-8">🏆</div>
            <h2 id="winTitle" class="text-5xl font-black text-slate-800 mb-4">挑戰完成</h2>
            <p id="winStats" class="text-slate-500 text-2xl font-bold mb-10"></p>
            <button onclick="location.reload()" class="bg-emerald-500 text-white px-16 py-6 rounded-3xl font-black text-2xl shadow-lg">重新開始</button>
        </div>
    </div>

    <script>
        const database = {
            '仁愛鄉': { icon: '🍄', food: '高山香菇', feature: '森林環境成長，肉質肥厚鮮甜。', carbon: '🌱 減碳 88%', allergen: '🟢 天然食材', voice: '仁愛鄉，高山香菇。吸收森林精華，營養價值極高。', rich: '仁愛鄉的<span class="keyword">高山香菇</span>生長在海拔1000公尺以上的原始林區。' },
            '國姓鄉': { icon: '☕', food: '國姓咖啡', feature: '精品豆，具有柑橘與堅果香氣。', carbon: '🌱 減碳 95%', allergen: '🟢 咖啡因注意', voice: '國姓鄉，精品咖啡。海拔適中，香氣優雅濃郁。', rich: '國姓鄉是台灣重要的<span class="keyword">精品咖啡</span>產區。' },
            '草屯鎮': { icon: '🍡', food: '手工麻糬', feature: '糯米香Q，是在地傳承的美味。', carbon: '🌱 在地米食', allergen: '🔴 含花生糯米', voice: '草屯鎮，手工麻糬。精選優質糯米，口感彈牙。', rich: '草屯麻糬傳承了數十年的製作工法，使用在地<span class="keyword">優質糯米</span>。' },
            '南投市': { icon: '🍜', food: '南投意麵', feature: '傳統曬製，麵體彈牙有勁。', carbon: '🌱 在地手作', allergen: '🟡 含有小麥', voice: '南投市，特色意麵。傳統工法製作，吸附滿滿精華。', rich: '南投意麵經過<span class="keyword">陽光短暫曝曬</span>，質地紮實。' },
            '中寮鄉': { icon: '🍯', food: '龍眼蜂蜜', feature: '純淨採集，滴滴芬芳透亮。', carbon: '🌱 友善蜜源', allergen: '🟡 嬰兒忌食', voice: '中寮鄉，龍眼蜂蜜。生態環境豐富，口感純淨。', rich: '中寮擁有廣大的龍眼林，蜂蜜色澤如琥珀。' },
            '埔里鎮': { icon: '🥬', food: '茭白筍', feature: '質地脆嫩，美人腿美稱。', carbon: '🌱 湧泉灌溉', allergen: '🟢 高纖安全', voice: '埔里鎮，茭白筍。潔淨湧泉灌溉，質地脆甜。', rich: '埔里鎮擁有全台最清澈的<span class="keyword">地下湧泉</span>，產出<span class="keyword">美人腿</span>。' },
            '魚池鄉': { icon: '🫖', food: '日月潭紅茶', feature: '具有薄荷與肉桂香氣。', carbon: '🌱 永續經營', allergen: '🟢 天然茶葉', voice: '魚池鄉，紅玉紅茶。香氣受國際肯定。', rich: '日月潭魚池鄉是<span class="keyword">紅玉紅茶</span>的故鄉。' },
            '名間鄉': { icon: '🍍', food: '名間鳳梨', feature: '紅土產出，酸甜比例完美。', carbon: '🌱 減碳 92%', allergen: '🟢 天然酵素', voice: '名間鄉，名間鳳梨。紅土環境生長。', rich: '名間鄉的<span class="keyword">紅土高原</span>土質肥沃，適合鳳梨生長。' },
            '集集鎮': { icon: '🍌', food: '集集山蕉', feature: '曾為天皇貢品，口感紮實。', carbon: '🌱 友善栽種', allergen: '🟢 安全無敏', voice: '集集鎮，山蕉。口感Q彈紮實，是理想能量。', rich: '集集山蕉在日治時期曾是<span class="keyword">日本天皇的補給品</span>。' },
            '水里鄉': { icon: '梅', food: '水里脆梅', feature: '手工釀造，生津止渴。', carbon: '🌱 古法煉製', allergen: '🟢 天然果實', voice: '水里鄉，脆梅。手工古法製作，消除疲勞。', rich: '水里鄉小農手工採收並以<span class="keyword">古法醃漬</span>。' },
            '鹿谷鄉': { icon: '🍵', food: '凍頂烏龍', feature: '雲霧滋養，焙火回甘。', carbon: '🌱 產銷低碳', allergen: '🟢 天然茶葉', voice: '鹿谷鄉，凍頂茶。氣候涼爽精心烘焙。', rich: '鹿谷<span class="keyword">凍頂烏龍茶</span>是台灣最具代表性的焙火茶。' },
            '竹山鎮': { icon: '🍠', food: '紅土地瓜', feature: '紅土孕育，質地綿密。', carbon: '🌱 減碳 96%', allergen: '🟢 優質澱粉', voice: '竹山鎮，紅土地瓜。口感綿密極甜。', rich: '竹山鎮特有的<span class="keyword">紅色黏質土壤</span>富含礦物質。' },
            '信義鄉': { icon: '🍇', food: '巨峰葡萄', feature: '高海拔冷涼孕育，飽滿多汁。', carbon: '🌱 高海拔鮮採', allergen: '🟢 天然果實', voice: '信義鄉，巨峰葡萄。飽滿如黑寶石。', rich: '信義鄉高海拔純淨溪水孕育出<span class="keyword">巨峰葡萄</span>。' }
        };

        let state = { red: { steps: 0, count: 0 }, green: { steps: 0, count: 0 }, occupied: {}, activeTeam: null, total: 0, gameOver: false, targetGoal: 13 };
        let currentUtterance = null;

        function initMap() {
            const container = document.getElementById('map-container');
            const svg = d3.select("#nantou-svg").attr("width", container.clientWidth).attr("height", container.clientHeight);
            const geoJsonUrl = "https://raw.githubusercontent.com/titaneric/Taiwan-GeoJSON/master/%E5%8D%97%E6%8A%95%E7%B8%A3%E9%84%89%E9%8E%AE.json";

            d3.json(geoJsonUrl).then(data => {
                const projection = d3.geoMercator().fitSize([container.clientWidth, container.clientHeight], data);
                const path = d3.geoPath().projection(projection);

                svg.append("g").selectAll("path").data(data.features).enter().append("path")
                   .attr("d", path).attr("class", "town")
                   .attr("data-town", d => d.properties.TOWNNAME || d.properties.name || d.properties.Town || "")
                   .on("click", function(event, d) {
                       const name = d3.select(this).attr("data-town");
                       handleMapClick(name);
                   });

                svg.append("g").selectAll("text").data(data.features).enter().append("text")
                   .attr("class", "town-label").attr("transform", d => `translate(${path.centroid(d)})`)
                   .attr("dy", ".35em").attr("text-anchor", "middle")
                   .text(d => (d.properties.TOWNNAME || d.properties.name || "").replace(/[鄉鎮市]/g, ""));

                document.getElementById('map-loading').classList.add('hidden');
            });
        }

        function initGame(goal) {
            state.targetGoal = goal;
            document.getElementById('goal-label').innerText = goal;
            document.getElementById('startModal').classList.add('hidden');
            initMap();
        }

        function addStep(team) {
            if (state.activeTeam || state.gameOver) return; 
            state[team].steps++;
            updatePlayerUI(team);
            if (state[team].steps >= 10) {
                state.activeTeam = team;
                triggerTask(team);
            }
        }

        function triggerTask(team) {
            // 1. 立即顯現資訊面板與解除地圖鎖定
            document.getElementById('infoPanel').classList.remove('hidden');
            document.getElementById(`card-${team}`).classList.add('active-task-area');
            document.getElementById('foodStory').innerText = "請在地圖上點選一個補給鄉鎮。";
            document.getElementById('skipVoiceBtn').classList.remove('hidden'); // 顯示手動按鈕
            
            // 2. 地圖亮起
            d3.selectAll(".town").filter(d => {
                const n = d.properties.TOWNNAME || d.properties.name || "";
                return !state.occupied[n];
            }).classed("selectable", true);

            // 3. 最後才嘗試語音
            speak(`請選擇補給食材。`);
            window.scrollTo({ top: 150, behavior: 'smooth' });
        }

        function manualUnlock() {
            // 強制讓目前的 activeTeam 可以操作地圖 (萬一語音當掉)
            if (state.activeTeam === 'speaking') {
                state.activeTeam = state.red.steps >= 10 ? 'red' : 'green';
                document.getElementById('skipVoiceBtn').classList.add('hidden');
            }
        }

        function handleMapClick(townName) {
            if (state.activeTeam === 'speaking' || !state.activeTeam || state.gameOver) return;
            if (state.occupied[townName]) return;

            const currentTeam = state.activeTeam;
            const data = database[townName];
            if (!data) return;

            // 立即鎖定
            state.activeTeam = 'speaking'; 
            state.occupied[townName] = currentTeam;
            state[currentTeam].count++;
            state.total++;

            // 地圖染色
            d3.selectAll(".town").classed("selectable", false);
            d3.selectAll(`[data-town='${townName}']`).attr("class", `town occupied-${currentTeam}`);

            updateScoreUI();
            updateFoodPanel(townName, data);

            speak(data.voice, () => {
                setTimeout(() => {
                    state.activeTeam = null; 
                    document.querySelectorAll('.active-task-area').forEach(el => el.classList.remove('active-task-area'));
                    document.getElementById('infoPanel').classList.add('hidden');
                    state.red.steps = 0; state.green.steps = 0;
                    updatePlayerUI('red'); updatePlayerUI('green');
                    if (state.total >= state.targetGoal) { state.gameOver = true; endGame(); }
                }, 1500); 
            });
        }

        function updateScoreUI() {
            document.getElementById('score-red').innerText = state.red.count;
            document.getElementById('score-green').innerText = state.green.count;
            document.getElementById('total-progress').innerText = state.total;
        }

        function updateFoodPanel(name, d) {
            document.getElementById('foodImg').innerText = d.icon;
            document.getElementById('foodName').innerText = name + '：' + d.food;
            document.getElementById('foodFeature').innerText = d.feature;
            document.getElementById('foodCarbon').innerText = d.carbon;
            document.getElementById('foodAllergen').innerText = d.allergen;
            document.getElementById('foodStory').innerText = d.voice;
            document.getElementById('foodRichText').innerHTML = d.rich;
            const box = document.getElementById('allergenBox');
            if(d.allergen.includes('🔴')) box.className = "bg-red-50 p-6 rounded-3xl border-2 border-red-100 shadow-sm";
            else if(d.allergen.includes('🟡')) box.className = "bg-yellow-50 p-6 rounded-3xl border-2 border-yellow-100 shadow-sm";
            else box.className = "bg-green-50 p-6 rounded-3xl border-2 border-green-100 shadow-sm";
        }

        function updatePlayerUI(team) {
            document.getElementById(`steps-${team}`).innerText = state[team].steps;
            document.getElementById(`bar-${team}`).style.width = `${(state[team].steps / 10) * 100}%`;
            const avatar = document.getElementById(`avatar-${team}`);
            if (state[team].steps > 0 && !state.activeTeam) avatar.classList.add('running');
            else avatar.classList.remove('running');
            document.getElementById(`btn-${team}`).disabled = !!state.activeTeam || state.gameOver;
        }

        function speak(text, onEnd) {
            window.speechSynthesis.cancel();
            currentUtterance = new SpeechSynthesisUtterance(text);
            currentUtterance.lang = 'zh-TW';
            currentUtterance.rate = 1.1; 
            const waves = document.getElementById('speakWaves');
            currentUtterance.onstart = () => waves.classList.remove('hidden');
            currentUtterance.onend = () => { waves.classList.add('hidden'); if (onEnd) onEnd(); };
            window.speechSynthesis.speak(currentUtterance);
        }

        function endGame() {
            const red = state.red.count;
            const green = state.green.count;
            const winner = red > green ? '紅隊' : '綠隊';
            document.getElementById('winTitle').innerText = `任務結束`;
            document.getElementById('winStats').innerText = `紅隊：${red} | 綠隊：${green}`;
            document.getElementById('winModal').classList.remove('hidden').classList.add('flex');
            speak(`任務結束。獲勝者為${winner}。感謝參與。`);
        }
    </script>
</body>
</html>
