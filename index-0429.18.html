<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邊跑邊逛 吃遍南投 - 專業競賽系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @keyframes bounce-run { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        .running { animation: bounce-run 0.3s infinite; }
        
        .township-path { 
            transition: all 0.3s ease;
            cursor: pointer;
            stroke: #fff;
            stroke-width: 1.5;
            fill: #E2E8F0;
        }
        
        .selectable:hover { fill: #CBD5E1; filter: brightness(1.05); }
        .occupied-red { fill: #FCA5A5 !important; fill-opacity: 0.9; cursor: not-allowed; }
        .occupied-green { fill: #86EFAC !important; fill-opacity: 0.9; cursor: not-allowed; }
        .active-task-area { border: 4px solid #F59E0B; animation: pulse-border 2s infinite; }
        
        @keyframes pulse-border { 0% { border-color: #F59E0B; } 50% { border-color: #FEF3C7; } 100% { border-color: #F59E0B; } }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .voice-bar { width: 3px; height: 10px; background: #F59E0B; animation: sound-wave 1s infinite ease-in-out; }
        @keyframes sound-wave { 0%, 100% { height: 5px; } 50% { height: 15px; } }
        
        .pointer-none { pointer-events: none !important; }
        
        /* 模式選擇彈窗動畫 */
        .scale-in { animation: scaleIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes scaleIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans pb-20">

    <!-- 遊戲初始模式選擇 (Start Modal) -->
    <div id="startModal" class="fixed inset-0 bg-slate-900/95 backdrop-blur-xl z-[200] flex items-center justify-center p-6">
        <div class="bg-white rounded-[4rem] p-12 max-w-2xl w-full shadow-2xl text-center scale-in border-4 border-emerald-500">
            <div class="text-6xl mb-6">🏃‍♂️</div>
            <h1 class="text-4xl font-black text-slate-800 mb-2">邊跑邊逛．吃遍南投</h1>
            <p class="text-slate-500 font-bold mb-10">請選擇本次食農跑旅的競賽模式</p>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- 半馬模式 -->
                <button onclick="startGame(7)" class="group bg-orange-50 hover:bg-orange-500 p-8 rounded-[3rem] border-2 border-orange-200 transition-all text-left relative overflow-hidden">
                    <div class="relative z-10">
                        <span class="bg-orange-500 group-hover:bg-white text-white group-hover:text-orange-600 px-4 py-1 rounded-full text-xs font-black uppercase">複審/演示專用</span>
                        <h3 class="text-2xl font-black text-orange-600 group-hover:text-white mt-4">半馬模式</h3>
                        <p class="text-orange-400 group-hover:text-orange-100 font-bold mt-1">搜集 7 種食材即完賽</p>
                    </div>
                    <div class="absolute right-[-20px] bottom-[-20px] text-8xl opacity-10 group-hover:opacity-20 transition-all">🥈</div>
                </button>

                <!-- 全馬模式 -->
                <button onclick="startGame(13)" class="group bg-emerald-50 hover:bg-emerald-500 p-8 rounded-[3rem] border-2 border-emerald-200 transition-all text-left relative overflow-hidden">
                    <div class="relative z-10">
                        <span class="bg-emerald-500 group-hover:bg-white text-white group-hover:text-emerald-600 px-4 py-1 rounded-full text-xs font-black uppercase">完整體驗</span>
                        <h3 class="text-2xl font-black text-emerald-600 group-hover:text-white mt-4">全馬模式</h3>
                        <p class="text-emerald-400 group-hover:text-emerald-100 font-bold mt-1">挑戰全縣 13 個鄉鎮</p>
                    </div>
                    <div class="absolute right-[-20px] bottom-[-20px] text-8xl opacity-10 group-hover:opacity-20 transition-all">🏆</div>
                </button>
            </div>
        </div>
    </div>

    <header class="bg-slate-900 text-white p-5 shadow-2xl sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-person-running text-2xl text-emerald-400"></i>
                <h1 class="text-2xl font-black italic tracking-tighter">邊跑邊逛・吃遍南投</h1>
            </div>
            <div class="flex gap-4 text-xs font-bold">
                <div class="flex items-center gap-2"><span class="w-3 h-3 rounded bg-red-400"></span> 紅隊</div>
                <div class="flex items-center gap-2"><span class="w-3 h-3 rounded bg-green-400"></span> 綠隊</div>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4 md:p-8 space-y-10">
        
        <!-- 統計看板 -->
        <section class="bg-white rounded-[3rem] shadow-xl p-8 border border-slate-200 overflow-hidden">
            <div class="flex flex-col md:flex-row justify-between items-start gap-8">
                <div class="md:w-1/3">
                    <h2 class="text-4xl font-black text-slate-800 mb-2">探索進度</h2>
                    <p class="text-slate-400 font-bold text-sm tracking-widest uppercase mb-6" id="mode-label">Nantou Food Discovery</p>
                    
                    <div class="space-y-4">
                        <div class="bg-red-50 p-5 rounded-3xl border-l-8 border-red-400 shadow-sm">
                            <p class="text-xs font-bold text-red-400 uppercase">Red Team</p>
                            <p class="text-3xl font-black text-red-600"><span id="score-red">0</span> <small class="text-xs text-slate-400">種</small></p>
                        </div>
                        <div class="bg-green-50 p-5 rounded-3xl border-l-8 border-green-400 shadow-sm">
                            <p class="text-xs font-bold text-green-400 uppercase">Green Team</p>
                            <p class="text-3xl font-black text-green-600"><span id="score-green">0</span> <small class="text-xs text-slate-400">種</small></p>
                        </div>
                        <div class="bg-orange-50 p-5 rounded-3xl border-l-8 border-orange-400 shadow-sm">
                            <p class="text-xs font-bold text-orange-400 uppercase">本局總進度</p>
                            <p class="text-3xl font-black text-orange-600"><span id="total-progress">0</span> / <span id="goal-label">7</span> <small class="text-xs text-slate-400">種</small></p>
                        </div>
                    </div>
                </div>

                <!-- 地圖區 -->
                <div class="md:w-2/3 flex justify-center bg-slate-50 rounded-3xl p-4 relative shadow-inner">
                    <svg id="nantouMap" viewBox="0 0 500 650" class="w-full max-w-[450px] h-auto drop-shadow-lg">
                        <g id="map-paths">
                            <path id="town-仁愛鄉" d="M300,50 L450,150 L480,300 L380,350 L320,250 L280,180 Z" class="township-path" onclick="handleMapClick('仁愛鄉')"></path>
                            <path id="town-國姓鄉" d="M220,100 L300,50 L280,180 L200,160 Z" class="township-path" onclick="handleMapClick('國姓鄉')"></path>
                            <path id="town-草屯鎮" d="M80,120 L220,100 L200,160 L100,180 Z" class="township-path" onclick="handleMapClick('草屯鎮')"></path>
                            <path id="town-南投市" d="M50,180 L100,180 L140,240 L60,260 Z" class="township-path" onclick="handleMapClick('南投市')"></path>
                            <path id="town-中寮鄉" d="M140,240 L220,240 L240,300 L120,300 Z" class="township-path" onclick="handleMapClick('中寮鄉')"></path>
                            <path id="town-埔里鎮" d="M200,160 L280,180 L320,250 L240,240 Z" class="township-path" onclick="handleMapClick('埔里鎮')"></path>
                            <path id="town-魚池鄉" d="M240,240 L320,250 L380,350 L280,350 L240,300 Z" class="township-path" onclick="handleMapClick('魚池鄉')"></path>
                            <path id="town-名間鄉" d="M60,260 L120,300 L100,380 L30,350 Z" class="township-path" onclick="handleMapClick('名間鄉')"></path>
                            <path id="town-集集鎮" d="M120,300 L240,300 L220,380 L100,380 Z" class="township-path" onclick="handleMapClick('集集鎮')"></path>
                            <path id="town-水里鄉" d="M220,380 L280,350 L320,450 L200,450 Z" class="township-path" onclick="handleMapClick('水里鄉')"></path>
                            <path id="town-鹿谷鄉" d="M100,380 L220,380 L180,500 L80,480 Z" class="township-path" onclick="handleMapClick('鹿谷鄉')"></path>
                            <path id="town-竹山鎮" d="M30,350 L100,380 L80,480 L20,550 Z" class="township-path" onclick="handleMapClick('竹山鎮')"></path>
                            <path id="town-信義鄉" d="M280,350 L380,350 L420,600 L200,600 L200,450 L320,450 Z" class="township-path" onclick="handleMapClick('信義鄉')"></path>
                        </g>
                        <g fill="#475569" font-size="14" font-weight="900" pointer-events="none" text-anchor="middle">
                            <text x="140" y="145">草屯</text><text x="250" y="90">國姓</text><text x="380" y="200">仁愛</text>
                            <text x="250" y="205">埔里</text><text x="95" y="225">南投</text><text x="180" y="270">中寮</text>
                            <text x="310" y="300">魚池</text><text x="165" y="345">集集</text><text x="75" y="325">名間</text>
                            <text x="250" y="420">水里</text><text x="145" y="445">鹿谷</text><text x="65" y="435">竹山</text>
                            <text x="310" y="520">信義</text>
                        </g>
                    </svg>
                </div>
            </div>
        </section>

        <!-- 跑步按鈕 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div id="card-red" class="bg-white rounded-[3rem] p-8 shadow-lg border-b-[12px] border-red-500 transition-all duration-300">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-3xl font-black text-red-600 italic">TEAM RED</h3>
                    <div id="avatar-red" class="text-5xl">🏃‍♂️</div>
                </div>
                <div class="space-y-4 mb-4">
                    <div class="flex justify-between text-xs font-bold text-slate-400 uppercase">
                        <span>Steps</span>
                        <span><span id="steps-red">0</span> / 10</span>
                    </div>
                    <div class="h-5 bg-slate-100 rounded-full overflow-hidden">
                        <div id="bar-red" class="h-full bg-red-500 transition-all duration-300" style="width: 0%"></div>
                    </div>
                </div>
                <button id="btn-red" onclick="addStep('red')" class="w-full bg-red-600 hover:bg-red-700 text-white font-black py-4 rounded-2xl shadow-lg active:scale-95 transition-all text-xl disabled:bg-slate-300 disabled:cursor-not-allowed">
                    開始跑步
                </button>
            </div>

            <div id="card-green" class="bg-white rounded-[3rem] p-8 shadow-lg border-b-[12px] border-green-500 transition-all duration-300">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-3xl font-black text-green-600 italic">TEAM GREEN</h3>
                    <div id="avatar-green" class="text-5xl">🏃‍♀️</div>
                </div>
                <div class="space-y-4 mb-4">
                    <div class="flex justify-between text-xs font-bold text-slate-400 uppercase">
                        <span>Steps</span>
                        <span><span id="steps-green">0</span> / 10</span>
                    </div>
                    <div class="h-5 bg-slate-100 rounded-full overflow-hidden">
                        <div id="bar-green" class="h-full bg-green-500 transition-all duration-300" style="width: 0%"></div>
                    </div>
                </div>
                <button id="btn-green" onclick="addStep('green')" class="w-full bg-green-600 hover:bg-green-700 text-white font-black py-4 rounded-2xl shadow-lg active:scale-95 transition-all text-xl disabled:bg-slate-300 disabled:cursor-not-allowed">
                    開始跑步
                </button>
            </div>
        </div>

        <!-- 資訊看板 -->
        <section id="infoPanel" class="hidden fade-in">
            <div class="bg-white rounded-[4rem] p-10 md:p-14 shadow-2xl border-4 border-orange-100 relative">
                <div class="flex flex-col lg:flex-row gap-12 items-center">
                    <div class="w-full lg:w-1/3 flex flex-col items-center">
                        <div class="w-64 h-64 bg-slate-50 rounded-[3.5rem] flex items-center justify-center text-8xl shadow-inner border-8 border-white mb-6" id="foodImg">❓</div>
                        <h2 class="text-4xl font-black text-slate-800 text-center" id="foodName">補給中...</h2>
                    </div>

                    <div class="w-full lg:w-2/3 space-y-6">
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                            <div class="bg-blue-50 p-6 rounded-3xl border-2 border-blue-100 shadow-sm">
                                <div class="flex items-center gap-2 mb-3 text-blue-500 font-black text-xs uppercase"><i class="fa-solid fa-star"></i> 特色</div>
                                <p id="foodFeature" class="text-sm font-bold text-slate-700 leading-relaxed">-</p>
                            </div>
                            <div class="bg-emerald-50 p-6 rounded-3xl border-2 border-emerald-100 shadow-sm">
                                <div class="flex items-center gap-2 mb-3 text-emerald-500 font-black text-xs uppercase"><i class="fa-solid fa-leaf"></i> 低碳</div>
                                <p id="foodCarbon" class="text-sm font-bold text-slate-700 leading-relaxed">-</p>
                            </div>
                            <div id="allergenBox" class="bg-slate-50 p-6 rounded-3xl border-2 border-slate-100 shadow-sm">
                                <div class="flex items-center gap-2 mb-3 text-slate-400 font-black text-xs uppercase"><i class="fa-solid fa-shield-halved"></i> 食安</div>
                                <p id="foodAllergen" class="text-sm font-bold text-slate-700 leading-relaxed">-</p>
                            </div>
                        </div>

                        <div class="bg-slate-900 text-white p-7 rounded-3xl flex items-start gap-6 shadow-xl border-l-8 border-orange-500">
                            <div class="text-4xl">🤖</div>
                            <div class="flex-1">
                                <div class="flex items-center justify-between mb-1">
                                    <p class="text-xs font-bold text-orange-400 tracking-widest uppercase">Kebbi AI Guide</p>
                                    <div id="speakWaves" class="flex gap-1 hidden"><div class="voice-bar"></div><div class="voice-bar"></div><div class="voice-bar"></div></div>
                                </div>
                                <p id="foodStory" class="text-lg font-medium leading-relaxed italic text-slate-100">請選擇補給食材。</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <div id="winModal" class="fixed inset-0 bg-slate-900/90 backdrop-blur-md z-[100] hidden items-center justify-center p-6 text-center">
        <div class="bg-white rounded-[4rem] p-16 max-w-xl w-full shadow-2xl">
            <div class="text-9xl mb-8">🏆</div>
            <h2 id="winTitle" class="text-5xl font-black text-slate-800 mb-4 italic">探索任務完成</h2>
            <p id="winStats" class="text-slate-500 text-2xl font-bold mb-10"></p>
            <button onclick="location.reload()" class="bg-emerald-500 text-white px-16 py-6 rounded-3xl font-black text-2xl shadow-lg hover:scale-110 transition">重新開始</button>
        </div>
    </div>

    <script>
        const database = {
            '仁愛鄉': { icon: '🍄', food: '高山香菇', feature: '森林環境成長，肉質肥厚鮮甜。', carbon: '🌱 減碳 88%', allergen: '🟢 天然食材', story: '深山香菇吸收森林養分，營養價值極高。' },
            '國姓鄉': { icon: '☕', food: '國姓咖啡', feature: '精品豆，具有柑橘與堅果香氣。', carbon: '🌱 減碳 95%', allergen: '🟢 咖啡因注意', story: '海拔適中，產出的咖啡豆品質優異，香氣濃郁。' },
            '草屯鎮': { icon: '🍡', food: '手工麻糬', feature: '糯米香Q，是在地傳承的美味。', carbon: '🌱 在地米食', allergen: '🔴 含花生糯米', story: '歷史悠久，選用優質糯米製作。對花生過敏者請留意。' },
            '南投市': { icon: '🍜', food: '南投意麵', feature: '傳統曬製，麵體彈牙有勁。', carbon: '🌱 在地手作', allergen: '🟡 含有小麥', story: '代表性小吃，適合運動後快速補充能量。' },
            '中寮鄉': { icon: '🍯', food: '龍眼蜂蜜', feature: '純淨採集，滴滴芬芳透亮。', carbon: '🌱 友善蜜源', allergen: '🟡 嬰兒忌食', story: '生態豐富，口感厚實。一歲以下幼兒請勿食用。' },
            '埔里鎮': { icon: '🥬', food: '茭白筍', feature: '質地脆嫩，美人腿美稱。', carbon: '🌱 湧泉灌溉', allergen: '🟢 高纖安全', story: '水質清澈，生產的茭白筍味道鮮甜，不需多餘調味。' },
            '魚池鄉': { icon: '🫖', food: '日月潭紅茶', feature: '具有薄荷與肉桂香氣。', carbon: '🌱 永續經營', allergen: '🟢 天然茶葉', story: '受國際肯定，是在地小農精心栽培的成果。' },
            '名間鄉': { icon: '🍍', food: '名間鳳梨', feature: '紅土產出，酸甜比例完美。', carbon: '🌱 減碳 92%', allergen: '🟢 天然酵素', story: '名間鄉紅土適合生長，富含酵素，有助消化健康。' },
            '集集鎮': { icon: '🍌', food: '集集山蕉', feature: '曾為天皇貢品，口感紮實。', carbon: '🌱 友善栽種', allergen: '🟢 安全無敏', story: '口感Q彈，是補充礦物質與能量的理想補給品。' },
            '水里鄉': { icon: '梅', food: '水里脆梅', feature: '手工釀造，生津止渴。', carbon: '🌱 古法煉製', allergen: '🟢 天然果實', story: '遵循古法製作，酸甜爽口，有效消除疲勞感。' },
            '鹿谷鄉': { icon: '🍵', food: '凍頂烏龍', feature: '雲霧滋養，焙火回甘。', carbon: '🌱 產銷低碳', allergen: '🟢 天然茶葉', story: '氣候涼爽，茶葉經精心烘焙，喉韻持久深遠。' },
            '竹山鎮': { icon: '🍠', food: '紅土地瓜', feature: '紅土孕育，質地綿密。', carbon: '🌱 減碳 96%', allergen: '🟢 優質澱粉', story: '紅土孕育，口感細緻，是在地減碳環保的代表食材。' },
            '信義鄉': { icon: '🍇', food: '巨峰葡萄', feature: '高海拔冷涼孕育，飽滿多汁。', carbon: '🌱 高海拔鮮採', allergen: '🟢 天然果實', story: '色澤深邃，連皮食用可攝取最高營養價值。' }
        };

        let state = {
            red: { steps: 0, count: 0 },
            green: { steps: 0, count: 0 },
            occupied: {}, 
            activeTeam: null, 
            total: 0,
            gameOver: false,
            targetGoal: 13 // 預設 13
        };

        let currentUtterance = null;

        // 啟動遊戲與選擇模式
        function startGame(goal) {
            state.targetGoal = goal;
            document.getElementById('goal-label').innerText = goal;
            document.getElementById('mode-label').innerText = goal === 7 ? 'Nantou Discovery (Half Marathon)' : 'Nantou Discovery (Full Marathon)';
            document.getElementById('startModal').classList.add('hidden');
        }

        function updateScoreUI() {
            document.getElementById('score-red').innerText = state.red.count;
            document.getElementById('score-green').innerText = state.green.count;
            document.getElementById('total-progress').innerText = state.total;
        }

        function addStep(team) {
            if (state.activeTeam || state.gameOver) return; 
            state[team].steps++;
            updatePlayerUI(team);
            if (state[team].steps >= 10) {
                state.activeTeam = team;
                triggerTask(team);
            }
        }

        function triggerTask(team) {
            document.getElementById('infoPanel').classList.remove('hidden');
            document.getElementById(`card-${team}`).classList.add('active-task-area');
            const msg = `請選擇補給食材。`;
            document.getElementById('foodStory').innerText = msg;
            
            const prevTeam = state.activeTeam;
            state.activeTeam = 'speaking';
            
            speak(msg, () => {
                state.activeTeam = prevTeam;
                updatePlayerUI('red');
                updatePlayerUI('green');
                document.querySelectorAll('.township-path').forEach(p => {
                    const town = p.id.replace('town-', '');
                    if (!state.occupied[town]) p.classList.add('selectable');
                });
            });
            window.scrollTo({ top: 150, behavior: 'smooth' });
        }

        function handleMapClick(townName) {
            if (state.activeTeam === 'speaking' || !state.activeTeam || state.gameOver) return;
            if (state.occupied[townName]) return;

            const currentTeam = state.activeTeam;
            const data = database[townName];

            // 1. 立即啟動物理鎖定與邏輯鎖定
            state.activeTeam = 'speaking'; 
            state.occupied[townName] = currentTeam;
            state[currentTeam].count++;
            state.total++;
            document.getElementById('nantouMap').classList.add('pointer-none');
            
            // 2. 步數同步歸零
            state.red.steps = 0;
            state.green.steps = 0;

            // 3. 更新介面
            updateScoreUI();
            updateFoodPanel(townName, data);
            const path = document.getElementById(`town-${townName}`);
            path.classList.add(currentTeam === 'red' ? 'occupied-red' : 'occupied-green');
            path.classList.remove('selectable');

            // 4. 語音導覽
            const intro = `${townName}，${data.food}。${data.story}`;
            speak(intro, () => {
                setTimeout(() => {
                    document.getElementById('card-red').classList.remove('active-task-area');
                    document.getElementById('card-green').classList.remove('active-task-area');
                    document.getElementById('infoPanel').classList.add('hidden');
                    document.getElementById('nantouMap').classList.remove('pointer-none');

                    // 檢查是否達成目標
                    if (state.total >= state.targetGoal) {
                        state.gameOver = true;
                        endGame();
                    } else {
                        state.activeTeam = null; 
                        updatePlayerUI('red');
                        updatePlayerUI('green');
                    }
                }, 1500); 
            });
        }

        function updateFoodPanel(name, d) {
            document.getElementById('foodImg').innerText = d.icon;
            document.getElementById('foodName').innerText = name;
            document.getElementById('foodFeature').innerText = d.feature;
            document.getElementById('foodCarbon').innerText = d.carbon;
            document.getElementById('foodAllergen').innerText = d.allergen;
            document.getElementById('foodStory').innerText = d.story;

            const box = document.getElementById('allergenBox');
            if(d.allergen.includes('🔴')) box.className = "bg-red-50 p-6 rounded-3xl border-2 border-red-100 shadow-sm";
            else if(d.allergen.includes('🟡')) box.className = "bg-yellow-50 p-6 rounded-3xl border-2 border-yellow-100 shadow-sm";
            else box.className = "bg-green-50 p-6 rounded-3xl border-2 border-green-100 shadow-sm";
        }

        function updatePlayerUI(team) {
            const steps = state[team].steps;
            document.getElementById(`steps-${team}`).innerText = steps;
            const bar = document.getElementById(`bar-${team}`);
            bar.style.width = `${(steps / 10) * 100}%`;
            
            const avatar = document.getElementById(`avatar-${team}`);
            if (steps > 0 && !state.activeTeam) avatar.classList.add('running');
            else avatar.classList.remove('running');
            
            document.getElementById(`btn-${team}`).disabled = !!state.activeTeam || state.gameOver;
        }

        function speak(text, onEnd) {
            window.speechSynthesis.cancel();
            currentUtterance = new SpeechSynthesisUtterance(text);
            currentUtterance.lang = 'zh-TW';
            currentUtterance.rate = 1.1; 
            const waves = document.getElementById('speakWaves');
            currentUtterance.onstart = () => waves.classList.remove('hidden');
            currentUtterance.onend = () => {
                waves.classList.add('hidden');
                if (onEnd) onEnd();
            };
            currentUtterance.onerror = () => {
                waves.classList.add('hidden');
                if (onEnd) onEnd();
            };
            window.speechSynthesis.speak(currentUtterance);
        }

        function endGame() {
            const red = state.red.count;
            const green = state.green.count;
            const winner = red > green ? '紅隊' : '綠隊';
            document.getElementById('winTitle').innerText = `任務結束`;
            document.getElementById('winStats').innerText = `紅隊：${red} | 綠隊：${green}`;
            document.getElementById('winModal').classList.remove('hidden');
            document.getElementById('winModal').classList.add('flex');
            speak(`跑旅結束。獲勝者為${winner}。感謝參與本次食農探索。`);
        }
    </script>
</body>
</html>
