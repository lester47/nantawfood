<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>更新領地戰版本</title><body><p id="status">正在更新本機網站快取，稍後開啟已確認的領地戰版本⋯</p><script>
(async()=>{
 try {
  if ('serviceWorker' in navigator) {
   const root = new URL('./', location.href).href;
   for (const registration of await navigator.serviceWorker.getRegistrations()) {
    if (registration.scope === root) await registration.unregister();
   }
  }
  if ('caches' in window) {
   for (const key of await caches.keys()) if (key.startsWith('nantou-')) await caches.delete(key);
  }
  location.replace('territory.html?revision=approved-20261029-r3');
 } catch (error) {
  document.getElementById('status').textContent='快取更新失敗：'+error.message;
  const link=document.createElement('a');link.href='territory.html?revision=approved-20261029-r3';link.textContent='開啟已確認的領地戰';document.body.append(link);
 }
})();
</script></body></html>
