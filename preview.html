    <ellipse class="lake" cx="438" cy="421" rx="38" ry="28"/><text x="438" y="422" class="map-note">日月潭</text>
  `;
  mapRegions.forEach(r=>{
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('data-town', r.name);
    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d', r.d); path.setAttribute('class','town'); path.setAttribute('data-town', r.name);
    path.addEventListener('click', ()=>handleMapClick(r.name));
    const food = document.createElementNS('http://www.w3.org/2000/svg','text');
    food.setAttribute('x', r.label[0]); food.setAttribute('y', r.label[1]-24); food.setAttribute('class','food-label');
    food.textContent = database[r.name]?.icon || '📍';
    const text = document.createElementNS('http://www.w3.org/2000/svg','text');
    text.setAttribute('x', r.label[0]); text.setAttribute('y', r.label[1]); text.setAttribute('class','town-label');
    text.textContent = districtCodes[r.name].fullName;
    const code = document.createElementNS('http://www.w3.org/2000/svg','text');
    code.setAttribute('x', r.label[0]); code.setAttribute('y', r.label[1]+20); code.setAttribute('class','code-label');
    code.textContent = districtCodes[r.name].code;
    g.appendChild(path); g.appendChild(food); g.appendChild(text); g.appendChild(code); svg.appendChild(g);
  });
}
function setSelectable(enabled){ document.querySelectorAll('.town').forEach(el=>{ const town=el.dataset.town; el.classList.toggle('selectable', enabled && !state.occupied[town]); }); }
function paintTown(town, team){ document.querySelectorAll(`.town[data-town="${town}"]`).forEach(el=>{ el.classList.remove('selectable'); el.classList.add(`occupied-${team}`); }); }
function addStep(team){ if(state.activeTeam || state.gameOver) return; state[team].steps++; updatePlayerUI(team); if(state[team].steps>=10 && !state.activeTeam){ state.activeTeam=team; triggerTask(team); } }
function triggerTask(team){ lastTaskTeam=team; document.getElementById('infoPanel').classList.add('show'); document.getElementById(`card-${team}`).classList.add('active'); document.getElementById('foodStory').innerText='跑得真棒！請在地圖上選擇一個鄉鎮進行補給。'; document.getElementById('skipVoiceBtn').classList.remove('hidden'); setSelectable(true); speak('請選擇補給食材。'); window.scrollTo({top:120,behavior:'smooth'}); }
function manualUnlock(){ if(state.activeTeam==='speaking' && lastTaskTeam){ state.activeTeam=lastTaskTeam; setSelectable(true); document.getElementById('skipVoiceBtn').classList.add('hidden'); } }
function handleMapClick(town){ if(state.activeTeam==='speaking' || !state.activeTeam || state.gameOver || state.occupied[town]) return; const team=state.activeTeam; const d=database[town]; if(!d) return; state.activeTeam='speaking'; state.occupied[town]=team; state[team].count++; state.total++; document.getElementById('score-red').innerText=state.red.count; document.getElementById('score-green').innerText=state.green.count; document.getElementById('total-progress').innerText=state.total; setSelectable(false); paintTown(town, team); updateFoodPanel(town,d); state.red.steps=0; state.green.steps=0; speak(d.voice,()=>{ setTimeout(()=>{ state.activeTeam=null; document.querySelectorAll('.team-card.active').forEach(el=>el.classList.remove('active')); document.getElementById('infoPanel').classList.remove('show'); document.getElementById('skipVoiceBtn').classList.add('hidden'); updatePlayerUI('red'); updatePlayerUI('green'); if(state.total>=state.targetGoal){ state.gameOver=true; endGame(); } },900); }); }
function updateFoodPanel(name,d){ document.getElementById('foodImg').innerText=d.icon; document.getElementById('foodName').innerText=districtCodes[name].fullName+'：'+d.food; document.getElementById('foodFeature').innerText=d.feature; document.getElementById('foodCarbon').innerText=d.carbon; document.getElementById('foodAllergen').innerText=d.allergen; document.getElementById('foodStory').innerText=d.voice; document.getElementById('foodRichText').innerHTML=d.rich; const box=document.getElementById('allergenBox'); box.style.background=d.allergen.includes('🔴')?'#fff1f2':d.allergen.includes('🟡')?'#fefce8':'#f0fdf4'; }
function updatePlayerUI(team){ const steps=state[team].steps; document.getElementById(`steps-${team}`).innerText=steps; document.getElementById(`bar-${team}`).style.width=`${Math.min(100,(steps/10)*100)}%`; const avatar=document.getElementById(`avatar-${team}`); avatar.classList.toggle('running', steps>0 && !state.activeTeam); document.getElementById(`btn-${team}`).disabled=!!state.activeTeam || state.gameOver; }
function speak(text,onEnd){ if(!('speechSynthesis' in window)){ if(onEnd) onEnd(); return; } window.speechSynthesis.cancel(); if(speechTimeout) clearTimeout(speechTimeout); const u=new SpeechSynthesisUtterance(text); u.lang='zh-TW'; u.rate=1.05; let done=false; const finish=()=>{ if(done)return; done=true; if(speechTimeout) clearTimeout(speechTimeout); if(onEnd) onEnd(); }; u.onend=finish; u.onerror=finish; speechTimeout=setTimeout(finish,Math.max(1600,text.length*260)); window.speechSynthesis.speak(u); }
function endGame(){ const r=state.red.count,g=state.green.count; let title,msg; if(r>g){title='紅隊獲勝！';msg=`紅隊：${r}｜綠隊：${g}。紅隊在本次跑旅中表現優異。`;} else if(g>r){title='綠隊獲勝！';msg=`紅隊：${r}｜綠隊：${g}。綠隊在本次跑旅中表現優異。`;} else{title='雙方平手！';msg=`紅隊：${r}｜綠隊：${g}。雙方都是優秀的食農小大使。`;} document.getElementById('winTitle').innerText=title; document.getElementById('winStats').innerText=msg; document.getElementById('winModal').classList.remove('hidden'); speak('任務結束。'+msg); }
</script>
