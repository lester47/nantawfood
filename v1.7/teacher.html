<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>教師控制台｜v1.7 一鍵開新場</title><script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script><style>
body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;background:linear-gradient(135deg,#fff1b8,#e9f8ee);color:#17351f}header{background:#263527;color:#fff;padding:22px 28px}.inner{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:16px}.pill{background:rgba(255,255,255,.15);padding:10px 16px;border-radius:999px;font-weight:1000}h1{margin:0;font-size:30px}.sub{font-size:13px;color:#d8f3dc;font-weight:900;margin-top:4px}main{max-width:1100px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#fffdf4;border:1px solid #e7dcc2;border-radius:30px;padding:24px;box-shadow:0 18px 44px rgba(0,0,0,.12)}button{border:0;border-radius:22px;padding:16px 18px;color:white;font-size:19px;font-weight:1000;cursor:pointer;margin:6px}.green{background:#16a34a}.blue{background:#2563eb}.purple{background:#7c3aed}.red{background:#dc2626}.dark{background:#263527}input,textarea{width:100%;padding:15px;border-radius:18px;border:1px solid #dacaa6;font-size:17px;font-weight:900;margin:8px 0;box-sizing:border-box}textarea{min-height:100px}.log{height:180px;overflow:auto;background:#1f2937;color:#d1fae5;border-radius:18px;padding:14px;font-family:Consolas,monospace}.note{margin-top:12px;padding:14px;border-radius:18px;background:#eff6ff;border:1px solid #bfdbfe;color:#1e3a8a;font-weight:900;line-height:1.7}@media(max-width:850px){.grid,.inner{display:grid;grid-template-columns:1fr}}
</style></head><body><header><div class="inner"><div><h1>教師控制台｜一鍵開新場</h1><div class="sub">v1.7 場次代碼＋小組代碼｜自動換 Topic｜避免舊資料污染</div></div><div id="mqttStatus" class="pill">MQTT 連線中</div></div></header><main><div class="grid">
<section class="card"><h2>場次管理</h2><input id="sessionInput" placeholder="場次代碼，例如 S260501-ABC"><button class="purple" onclick="newSession()">✨ 一鍵開新場</button><button class="blue" onclick="openBoard()">查看本場排行榜</button><div class="note">每一場會使用獨立 MQTT Topic：<br><b>nantou-food-race/場次代碼/小組代碼/...</b><br>因此舊資料不會影響新比賽。</div></section>
<section class="card"><h2>建立小組連結</h2><input id="groupInput" placeholder="小組代碼，例如 A7K2；空白自動產生"><button class="dark" onclick="openMain()">開啟小組主畫面</button><button class="dark" onclick="copyPlayer()">複製玩家網址</button></section>
<section class="card"><h2>全班活動控制</h2><button class="green" onclick="sendControl('start')">▶ 全班開始</button><button class="blue" onclick="sendControl('resume')">⏯ 全班繼續</button><button class="purple" onclick="sendControl('pause')">⏸ 全班暫停</button><button class="red" onclick="sendControl('end')">⛔ 全班結束</button><button class="red" onclick="resetAll()">🧹 本場歸零</button></section>
<section class="card"><h2>全班公告</h2><textarea id="msg" placeholder="例如：剩下30秒！"></textarea><button class="purple" onclick="sendMessage()">📣 發送公告</button><h3>控制紀錄</h3><div id="log" class="log"></div></section>
</div></main><script>
const MQTT_URL="wss://MQTTGO.io:8084/mqtt", BASE="nantou-food-race";let client=null;const $=id=>document.getElementById(id);function norm(v){return String(v||"").trim().toUpperCase().replace(/[^A-Z0-9-]/g,"").slice(0,18)}function normGroup(v){return String(v||"").trim().toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,6)}function randGroup(){return Math.random().toString(36).slice(2,6).toUpperCase()}function randSession(){const d=new Date();return `S${String(d.getFullYear()).slice(2)}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}-${Math.random().toString(36).slice(2,5).toUpperCase()}`}function getSession(){let s=norm($("sessionInput").value)||localStorage.getItem("nantou-food-session-id")||"S001";$("sessionInput").value=s;localStorage.setItem("nantou-food-session-id",s);return s}function getGroup(){return normGroup($("groupInput").value)||randGroup()}function controlTopic(){return `${BASE}/${getSession()}/control/all`}function log(t){$("log").innerHTML=`[${new Date().toLocaleTimeString('zh-TW',{hour12:false})}] ${t}<br>`+$("log").innerHTML}function newSession(){const s=randSession();$("sessionInput").value=s;localStorage.setItem("nantou-food-session-id",s);log("建立新場次："+s);alert("已建立新場次："+s)}function pub(p){if(!client||!client.connected){alert("MQTT 尚未連線");return}client.publish(controlTopic(),JSON.stringify({...p,sessionId:getSession(),target:"all",timestamp:Date.now(),source:"teacher",version:"v1.7"}));log("送出："+p.action)}function sendControl(a){pub({action:a})}function resetAll(){if(confirm("確定要本場歸零嗎？")) pub({action:"resetAll"})}function sendMessage(){pub({action:"message",text:$("msg").value.trim()||"請注意教師指令。"})}function openMain(){const g=getGroup(),s=getSession();location.href=`index.html?session=${s}&group=${g}`}function openBoard(){location.href=`leaderboard.html?session=${getSession()}`}async function copyPlayer(){const g=getGroup(),s=getSession();const u=`${location.origin}${location.pathname.replace('teacher.html','')}player.html?session=${s}&group=${g}`;try{await navigator.clipboard.writeText(u);alert('已複製：
'+u)}catch(e){prompt('請複製',u)}}client=mqtt.connect(MQTT_URL,{clientId:"teacher-v17-"+Math.random().toString(16).slice(2),clean:true,reconnectPeriod:2000});client.on('connect',()=>{$("mqttStatus").textContent="MQTT 已連線｜教師主控中";log('MQTT 已連線')});client.on('reconnect',()=>{$("mqttStatus").textContent="MQTT 重連中"});$("sessionInput").value=localStorage.getItem("nantou-food-session-id")||"S001";</script></body></html>
