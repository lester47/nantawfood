<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>教師控制台 v1.7</title>
</head>
<body>

<h2>一鍵開新場</h2>
<button onclick="newSession()">開新場</button>

<p id="result"></p>

<script>
function rand(){
  return "S" + Math.random().toString(36).substring(2,6).toUpperCase();
}

function newSession(){
  const s = rand();
  const url = `index.html?session=${s}`;
  document.getElementById("result").innerHTML = `
  新場次：${s}<br>
  <a href="${url}" target="_blank">開啟主畫面</a>
  `;
}
</script>

</body>
</html>
