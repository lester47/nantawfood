<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>v1.7 主畫面</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>
<h2>目前場次：<span id="session"></span></h2>

<script>
const url = new URL(location.href);
const session = url.searchParams.get("session") || "S001";
document.getElementById("session").innerText = session;

const client = mqtt.connect("wss://mqttgo.io:8084/mqtt");
const topic = `nantou-food-race/${session}/test`;

client.on("connect", ()=>{
  console.log("connected", topic);
});
</script>
</body>
</html>
