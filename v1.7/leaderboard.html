<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>排行榜 v1.7</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>

<h2>排行榜（只看目前場次）</h2>
<input id="session" placeholder="輸入場次 SXXX">
<button onclick="connect()">連線</button>

<ul id="list"></ul>

<script>
let client;

function connect(){
  const session = document.getElementById("session").value;
  const topic = `nantou-food-race/${session}/#`;

  client = mqtt.connect("wss://mqttgo.io:8084/mqtt");

  client.on("connect", ()=>{
    client.subscribe(topic);
  });

  client.on("message", (t,msg)=>{
    const li = document.createElement("li");
    li.innerText = t + " → " + msg.toString();
    document.getElementById("list").appendChild(li);
  });
}
</script>

</body>
</html>
