<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>南投食農領地戰｜v1.4.1 多組排行榜與全場歸零</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2f855a">
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    :root{--green:#16a34a;--red:#ef4444;--gold:#f59e0b;--ink:#263527;--paper:#fffdf4;--line:#e7dcc2;}
    *{box-sizing:border-box} body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;background:radial-gradient(circle at 16% 0%,rgba(255,224,128,.72),transparent 34%),linear-gradient(135deg,#f8f1dc,#eff7e5 55%,#eaf6ff);color:var(--ink);min-height:100vh;}
    header{background:rgba(38,53,39,.94);color:#fff;padding:18px 24px;box-shadow:0 10px 28px rgba(0,0,0,.18);position:sticky;top:0;z-index:3;}
    .head{max-width:1180px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:14px}.logo{width:54px;height:54px;border-radius:18px;background:linear-gradient(135deg,#f59e0b,#22c55e);display:grid;place-items:center;font-size:30px}h1{font-size:28px;margin:0;font-weight:1000;letter-spacing:-.04em}.sub{font-size:13px;color:#d8f3dc;font-weight:900;margin-top:4px}.pill{border-radius:999px;background:rgba(255,255,255,.14);padding:10px 14px;font-weight:1000;font-size:13px}.pill.offline{background:#7f1d1d}.wrap{max-width:1180px;margin:auto;padding:24px}.toolbar{display:grid;grid-template-columns:1fr auto auto;gap:12px;margin-bottom:18px}input,button{font-family:inherit;font-weight:1000;border:none}input{padding:14px 16px;border-radius:18px;border:2px solid var(--line);font-size:16px;background:#fffdf4}button,.link{padding:14px 18px;border-radius:18px;background:var(--green);color:white;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.link{background:#263527}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:18px}.stat{background:rgba(255,253,244,.94);border:1px solid var(--line);border-radius:28px;padding:20px;box-shadow:0 14px 30px rgba(75,59,29,.12)}.stat b{display:block;color:#6b7a65;font-size:13px}.stat strong{font-size:38px;color:#315a24}.board{background:rgba(255,253,244,.96);border:1px solid var(--line);border-radius:34px;box-shadow:0 20px 42px rgba(75,59,29,.15);overflow:hidden}.board-head{display:grid;grid-template-columns:70px 1.2fr 1fr 1fr 1fr 1fr 1fr;gap:10px;padding:14px 18px;background:#263527;color:white;font-weight:1000}.row{display:grid;grid-template-columns:70px 1.2fr 1fr 1fr 1fr 1fr 1fr;gap:10px;align-items:center;padding:16px 18px;border-top:1px solid var(--line);font-weight:900}.row:nth-child(even){background:#fff8e8}.rank{font-size:28px}.rank.r1{color:#d97706}.rank.r2{color:#64748b}.rank.r3{color:#b45309}.bar{height:12px;background:#e5e7eb;border-radius:999px;overflow:hidden}.bar i{height:100%;display:block;background:linear-gradient(90deg,#16a34a,#f59e0b);border-radius:999px}.tag{display:inline-block;padding:6px 10px;border-radius:999px;background:#dcfce7;color:#166534;font-size:12px}.tag.finished{background:#fee2e2;color:#991b1b}.empty{text-align:center;padding:58px 20px;color:#6b7a65;font-weight:1000;font-size:20px}.small{font-size:12px;color:#6b7a65;margin-top:6px;font-weight:900} @media(max-width:850px){.toolbar{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.board-head{display:none}.row{grid-template-columns:1fr;gap:6px}.row>div:before{content:attr(data-label) "：";color:#6b7a65}.rank:before{content:""!important}}
  </style>
</head>
<body>
  <header><div class="head"><div class="brand"><div class="logo">🏆</div><div><h1>南投食農領地戰｜多組排行榜</h1><div class="sub">v1.4.1 Room ID 即時競賽總覽｜MQTTGO.io｜支援全場歸零</div></div></div><div id="mqttStatus" class="pill offline">MQTT 連線中</div></div></header>
  <main class="wrap">
    <div class="toolbar">
      <input id="filterInput" placeholder="輸入房號篩選，例如 A7K2；空白顯示全部" />
      <button id="clearBtn">清空畫面資料</button>
      <button id="globalResetBtn" style="background:#dc2626">🧹 全場歸零</button>
      <a class="link" href="./index.html">回主畫面</a>
    </div>
    <section class="cards">
      <div class="stat"><b>目前房間數</b><strong id="roomCount">0</strong></div>
      <div class="stat"><b>最高總分</b><strong id="topScore">0</strong></div>
      <div class="stat"><b>最後更新</b><strong id="lastUpdate" style="font-size:24px">--:--:--</strong></div>
    </section>
    <section class="board">
      <div class="board-head"><div>排名</div><div>房間</div><div>紅隊</div><div>綠隊</div><div>總佔領</div><div>總分</div><div>狀態</div></div>
      <div id="boardBody"><div class="empty">等待各房間送出比賽摘要資料...</div></div>
    </section>
    <div class="small">訂閱 Topic：nantou-food-race/+/summary 與 nantou-food-race/leaderboard/update。若沒有資料，請先讓某一房間完成一次攻佔。</div>
  </main>
<script>
const MQTT_SERVER = "wss://MQTTGO.io:8084/mqtt";
const TOPIC_SUMMARY = "nantou-food-race/+/summary";
const TOPIC_UPDATE = "nantou-food-race/leaderboard/update";
const TOPIC_CONTROL_ALL = "nantou-food-race/control/all";
let mqttClient = null;
const rooms = new Map();
const $ = id => document.getElementById(id);
function setMqttStatus(text, ok=false){ const el=$("mqttStatus"); el.textContent=text; el.classList.toggle("offline", !ok); }
function fmtTime(ts){ const d=new Date(ts||Date.now()); return d.toLocaleTimeString("zh-TW",{hour12:false}); }
function normalizeRoomId(v){ return String(v||"").trim().toUpperCase(); }
function ingest(payloadText){
  let data; try{ data=JSON.parse(payloadText); }catch(e){ return; }
  const roomId = normalizeRoomId(data.roomId); if(!roomId) return;
  const old = rooms.get(roomId) || {};
  rooms.set(roomId, {...old, ...data, roomId, timestamp:data.timestamp||Date.now()});
  render();
}
function render(){
  const filter = normalizeRoomId($("filterInput").value);
  let list = Array.from(rooms.values());
  if(filter) list = list.filter(r => r.roomId.includes(filter));
  list.sort((a,b) => (b.totalScore||0)-(a.totalScore||0) || (b.totalTerritory||0)-(a.totalTerritory||0) || (b.timestamp||0)-(a.timestamp||0));
  $("roomCount").textContent = rooms.size;
  $("topScore").textContent = list[0]?.totalScore || 0;
  $("lastUpdate").textContent = rooms.size ? fmtTime(Math.max(...Array.from(rooms.values()).map(r=>r.timestamp||0))) : "--:--:--";
  const body=$("boardBody");
  if(!list.length){ body.innerHTML = '<div class="empty">目前沒有符合條件的房間資料</div>'; return; }
  body.innerHTML = list.map((r,i)=>{
    const rankClass = i===0?'r1':i===1?'r2':i===2?'r3':'';
    const medal = i===0?'🥇':i===1?'🥈':i===2?'🥉':`#${i+1}`;
    const total = r.totalTerritory ?? ((r.redTerritory||0)+(r.greenTerritory||0));
    const score = r.totalScore ?? total*10;
    const percent = Math.min(100, Math.round((total/(r.goal||13))*100));
    const status = r.status || 'playing';
    const statusText = status==='finished'?'完成':status==='waiting'?'等待中':'進行中';
    return `<div class="row">
      <div class="rank ${rankClass}" data-label="排名">${medal}</div>
      <div data-label="房間"><b>${r.groupName || '房間 '+r.roomId}</b><div class="small">${r.roomId}｜更新 ${fmtTime(r.timestamp)}</div></div>
      <div data-label="紅隊">🔴 ${r.redTerritory||0}<div class="small">步數 ${r.redSteps||0}</div></div>
      <div data-label="綠隊">🟢 ${r.greenTerritory||0}<div class="small">步數 ${r.greenSteps||0}</div></div>
      <div data-label="總佔領">${total} / ${r.goal||13}<div class="bar"><i style="width:${percent}%"></i></div></div>
      <div data-label="總分"><b style="font-size:24px">${score}</b></div>
      <div data-label="狀態"><span class="tag ${status==='finished'?'finished':''}">${statusText}</span></div>
    </div>`;
  }).join('');
}
$("filterInput").addEventListener("input", render);
$("clearBtn").onclick = () => { rooms.clear(); render(); };
function clearKnownRetainedSummaries() { if (!mqttClient || !mqttClient.connected) return; rooms.forEach((_, roomId) => mqttClient.publish(`nantou-food-race/${roomId}/summary`, "", { retain: true })); }
function publishGlobalReset() { const ok = confirm("確定要全場歸零嗎？所有房間、玩家端與排行榜都會清空。是否繼續？"); if (!ok) return; const payload = { version: "v1.4.1", action: "resetAll", target: "all", timestamp: Date.now() }; clearKnownRetainedSummaries(); rooms.clear(); render(); if (mqttClient && mqttClient.connected) { mqttClient.publish(TOPIC_CONTROL_ALL, JSON.stringify(payload), { retain: false }); mqttClient.publish(TOPIC_UPDATE, JSON.stringify(payload), { retain: false }); } }
$("globalResetBtn").onclick = publishGlobalReset;
function handleControlMessage(payloadText) { let data = {}; try { data = JSON.parse(payloadText); } catch(e) { return; } if (data.action === "resetAll") { rooms.clear(); render(); setMqttStatus("已收到全場歸零｜排行榜已清空", true); } }
function initMqtt(){
  if(typeof mqtt === "undefined"){ setMqttStatus("MQTT 套件未載入", false); return; }
  const client = mqtt.connect(MQTT_SERVER, { clientId: 'nantou-leaderboard-'+Math.random().toString(16).slice(2), clean:true, reconnectPeriod:2000, connectTimeout:8000 });
  mqttClient = client;
  client.on('connect', () => { setMqttStatus('MQTT 已連線｜排行榜監看中', true); client.subscribe([TOPIC_SUMMARY, TOPIC_UPDATE, TOPIC_CONTROL_ALL], err => { if(err) setMqttStatus('MQTT 訂閱失敗', false); }); });
  client.on('reconnect', () => setMqttStatus('MQTT 重新連線中', false));
  client.on('offline', () => setMqttStatus('MQTT 離線', false));
  client.on('error', err => { setMqttStatus('MQTT 錯誤', false); console.warn(err); });
  client.on('message', (topic,msg) => { const text = msg.toString(); if (topic === TOPIC_CONTROL_ALL) handleControlMessage(text); else ingest(text); });
}
initMqtt(); render();
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{})); }
</script>
</body>
</html>
