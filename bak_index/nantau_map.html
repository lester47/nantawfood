<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>南投食農領地戰</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

  <style>
    body {
      margin: 0;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: #f6f4e9;
      color: #2f3a24;
    }

    .app {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 24px;
      padding: 28px;
      max-width: 1200px;
      margin: auto;
    }

    .map-card, .panel {
      background: #fffdf4;
      border-radius: 24px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.12);
      padding: 20px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 32px;
      color: #315a24;
    }

    .team-buttons {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 12px 22px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .red-btn {
      background: #e84b4b;
      color: white;
    }

    .green-btn {
      background: #4caf50;
      color: white;
    }

    .active {
      outline: 4px solid #ffd54f;
      transform: scale(1.05);
    }

    svg {
      width: 100%;
      height: 720px;
      background: radial-gradient(circle, #fff8b7 0%, #f6f4e9 65%);
      border: 2px solid #333;
      border-radius: 12px;
    }

    .town {
      fill: #d8d8c8;
      stroke: #ffffff;
      stroke-width: 1.2;
      cursor: pointer;
      transition: 0.2s;
      filter: drop-shadow(2px 3px 3px rgba(0,0,0,0.25));
    }

    .town:hover {
      fill: #ffe082;
      stroke: #ff6f00;
      stroke-width: 2.5;
    }

    .town.red {
      fill: #e84b4b;
    }

    .town.green {
      fill: #4caf50;
    }

    .town.selected {
      stroke: #222;
      stroke-width: 3.5;
    }

    .town-label {
      font-size: 14px;
      font-weight: 800;
      fill: #2e2e2e;
      paint-order: stroke;
      stroke: white;
      stroke-width: 4px;
      pointer-events: none;
    }

    .score {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 16px 0;
    }

    .score-box {
      border-radius: 20px;
      padding: 18px;
      color: white;
      font-size: 22px;
      font-weight: 800;
      text-align: center;
    }

    .score-red { background: #e84b4b; }
    .score-green { background: #4caf50; }

    .info-box {
      background: #f1f6e8;
      border-radius: 18px;
      padding: 18px;
      margin-top: 16px;
      line-height: 1.8;
      font-size: 20px;
    }

    .product {
      font-size: 30px;
      font-weight: 900;
      color: #315a24;
    }

    .hint {
      color: #666;
      font-size: 16px;
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="map-card">
      <h1>南投食農領地戰</h1>

      <div class="team-buttons">
        <button id="redBtn" class="red-btn active">紅隊</button>
        <button id="greenBtn" class="green-btn">綠隊</button>
      </div>

      <svg id="map"></svg>
    </div>

    <div class="panel">
      <h1>戰況資訊</h1>

      <div class="score">
        <div class="score-box score-red">紅隊：<span id="redScore">0</span></div>
        <div class="score-box score-green">綠隊：<span id="greenScore">0</span></div>
      </div>

      <div class="info-box">
        <div class="hint">目前選擇</div>
        <div id="townName" class="product">尚未選擇</div>
        <div id="productName">請點選地圖上的鄉鎮</div>
        <hr />
        <div id="featureText">選擇後會顯示代表農產品與特色。</div>
      </div>
    </div>
  </div>

  <script>
    let currentTeam = "red";
    const occupied = {};
    let selectedTown = null;

    const foodData = {
      "仁愛鄉": { product: "高山香菇", feature: "森林環境、肥厚菌傘、深山接菌栽培" },
      "國姓鄉": { product: "國姓咖啡", feature: "阿拉比卡豆、柑橘香氣、高海拔精品咖啡" },
      "草屯鎮": { product: "手工麻糬", feature: "糯米香Q、內餡紮實、在地傳承" },
      "南投市": { product: "南投意麵", feature: "陽光曝曬、麵體彈牙、傳統工法、古早味" },
      "中寮鄉": { product: "龍眼蜂蜜", feature: "純淨蜜源、琥珀色澤、花香濃郁" },
      "埔里鎮": { product: "茭白筍", feature: "美人腿、湧泉灌溉、潔白脆嫩" },
      "魚池鄉": { product: "日月潭紅茶", feature: "紅玉紅茶、薄荷香、紅寶石茶湯" },
      "名間鄉": { product: "名間鳳梨", feature: "紅土高原、酸甜比例、果肉細緻" },
      "集集鎮": { product: "集集山蕉", feature: "日本天皇貢品、口感紮實Q彈、高地生長" },
      "水里鄉": { product: "水里脆梅", feature: "手工古法、酸甜爽口、青梅醃漬" },
      "鹿谷鄉": { product: "凍頂烏龍", feature: "雲霧滋養、炭火慢焙、金黃茶湯" },
      "竹山鎮": { product: "紅土地瓜", feature: "紅色黏土栽培、質地綿密極甜、膳食纖維" },
      "信義鄉": { product: "巨峰葡萄", feature: "黑寶石、高海拔冷涼孕育、果粉濃厚" }
    };

    const redBtn = document.getElementById("redBtn");
    const greenBtn = document.getElementById("greenBtn");

    redBtn.onclick = () => setTeam("red");
    greenBtn.onclick = () => setTeam("green");

    function setTeam(team) {
      currentTeam = team;
      redBtn.classList.toggle("active", team === "red");
      greenBtn.classList.toggle("active", team === "green");
    }

    function updateScore() {
      let red = 0;
      let green = 0;

      Object.values(occupied).forEach(team => {
        if (team === "red") red++;
        if (team === "green") green++;
      });

      document.getElementById("redScore").textContent = red;
      document.getElementById("greenScore").textContent = green;
    }

    function showInfo(town) {
      const data = foodData[town] || {
        product: "未設定農產品",
        feature: "尚未建立資料"
      };

      document.getElementById("townName").textContent = town;
      document.getElementById("productName").textContent = data.product;
      document.getElementById("featureText").textContent = data.feature;
    }

    const svg = d3.select("#map");
    const width = 720;
    const height = 720;
    svg.attr("viewBox", `0 0 ${width} ${height}`);

    const geoJsonUrl =
      "https://raw.githubusercontent.com/titaneric/Taiwan-GeoJSON/master/%E5%8D%97%E6%8A%95%E7%B8%A3%E9%84%89%E9%8E%AE.json";

    d3.json(geoJsonUrl).then(geoData => {
      const projection = d3.geoMercator().fitSize([width, height], geoData);
      const path = d3.geoPath().projection(projection);

      svg.selectAll("path")
        .data(geoData.features)
        .enter()
        .append("path")
        .attr("class", "town")
        .attr("d", path)
        .attr("data-name", d => d.properties.TOWNNAME || d.properties.name)
        .on("click", function(event, d) {
          const town = d.properties.TOWNNAME || d.properties.name;

          occupied[town] = currentTeam;

          d3.selectAll(".town").classed("selected", false);
          d3.select(this)
            .classed("red", false)
            .classed("green", false)
            .classed(currentTeam, true)
            .classed("selected", true);

          selectedTown = town;
          showInfo(town);
          updateScore();
        });

      svg.selectAll("text")
        .data(geoData.features)
        .enter()
        .append("text")
        .attr("class", "town-label")
        .attr("x", d => path.centroid(d)[0])
        .attr("y", d => path.centroid(d)[1])
        .attr("text-anchor", "middle")
        .attr("alignment-baseline", "middle")
        .text(d => d.properties.TOWNNAME || d.properties.name);
    });
  </script>
</body>
</html>
