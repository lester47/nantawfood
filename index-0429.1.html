<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>南投環線：低碳食材跑旅大賽</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @keyframes run-animation { 0% { transform: translateX(0); } 50% { transform: translateX(10px); } 100% { transform: translateX(0); } }
        .running { animation: run-animation 0.5s infinite linear; }
        .township-dot { transition: all 0.5s ease; }
        .active-township { transform: scale(1.5); background-color: #10B981 !important; box-shadow: 0 0 15px rgba(16, 185, 129, 0.6); }
        .team-red { background-color: #EF4444; }
        .team-green { background-color: #10B981; }
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans">

    <!-- 頂部狀態列 -->
    <header class="bg-slate-900 text-white p-4 shadow-lg sticky top-0 z-50">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-person-running text-2xl text-green-400"></i>
                <h1 class="text-xl font-bold tracking-tight">南投環線：低碳食材跑旅</h1>
            </div>
            <div class="flex gap-4 items-center">
                <div id="connectionStatus" class="text-xs bg-red-900 px-3 py-1 rounded-full border border-red-700">
                    <i class="fa-solid fa-link-slash mr-1"></i> 未連線 micro:bit
                </div>
                <button onclick="toggleAdmin()" class="hover:text-green-400"><i class="fa-solid fa-gear"></i></button>
            </div>
        </div>
    </header>

    <!-- 13 鄉鎮地圖軌道 -->
    <div class="bg-white border-b border-slate-200 p-6 overflow-x-auto">
        <div class="max-w-5xl mx-auto min-w-[1000px]">
            <div class="relative flex justify-between items-center px-10 h-12">
                <div class="absolute h-1 bg-slate-200 left-10 right-10 top-1/2 -translate-y-1/2"></div>
                <!-- 13 個站點 -->
                <script>
                    const townships = ["南投市", "埔里鎮", "草屯鎮", "竹山鎮", "集集鎮", "名間鄉", "鹿谷鄉", "中寮鄉", "魚池鄉", "國姓鄉", "水里鄉", "信義鄉", "仁愛鄉"];
                    townships.forEach((name, index) => {
                        document.write(`
                            <div id="town-${index}" class="township-dot relative z-10 w-4 h-4 bg-slate-300 rounded-full flex items-center justify-center">
                                <span class="absolute -bottom-8 text-[10px] font-bold text-slate-500 whitespace-nowrap">${name}</span>
                                <span id="town-marker-${index}" class="absolute -top-6 text-sm opacity-0 transition-opacity">🚩</span>
                            </div>
                        `);
                    });
                </script>
            </div>
        </div>
    </div>

    <main class="max-w-5xl mx-auto p-4 md:p-8 space-y-8">
        
        <!-- 跑者對決區 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- 紅隊 -->
            <div id="card-red" class="bg-white rounded-3xl p-6 shadow-md border-b-8 border-red-500 transition-all">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-2xl font-black text-red-600 italic">TEAM RED</h2>
                    <span class="text-xs bg-red-100 text-red-700 px-3 py-1 rounded-full font-bold">目前位於：<span id="pos-red">南投市</span></span>
                </div>
                <div class="flex items-center gap-6">
                    <div class="text-5xl" id="avatar-red">🏃‍♂️</div>
                    <div class="flex-1">
                        <div class="text-4xl font-black text-slate-800 mb-1"><span id="steps-red">0</span> <small class="text-lg text-slate-400 font-normal">STEPS</small></div>
                        <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                            <div id="progress-red" class="bg-red-500 h-full transition-all duration-300" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
                <div class="mt-6 grid grid-cols-2 gap-2">
                    <button onclick="addSteps('red')" class="bg-red-50 hover:bg-red-100 text-red-600 font-bold py-3 rounded-xl transition active:scale-95">模擬跑 1 步</button>
                    <button id="task-red" disabled class="bg-slate-100 text-slate-400 font-bold py-3 rounded-xl cursor-not-allowed">等待任務...</button>
                </div>
            </div>

            <!-- 綠隊 -->
            <div id="card-green" class="bg-white rounded-3xl p-6 shadow-md border-b-8 border-green-500 transition-all">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-2xl font-black text-green-600 italic">TEAM GREEN</h2>
                    <span class="text-xs bg-green-100 text-green-700 px-3 py-1 rounded-full font-bold">目前位於：<span id="pos-green">南投市</span></span>
                </div>
                <div class="flex items-center gap-6">
                    <div class="text-5xl" id="avatar-green">🏃‍♀️</div>
                    <div class="flex-1">
                        <div class="text-4xl font-black text-slate-800 mb-1"><span id="steps-green">0</span> <small class="text-lg text-slate-400 font-normal">STEPS</small></div>
                        <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                            <div id="progress-green" class="bg-green-500 h-full transition-all duration-300" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
                <div class="mt-6 grid grid-cols-2 gap-2">
                    <button onclick="addSteps('green')" class="bg-green-50 hover:bg-green-100 text-green-600 font-bold py-3 rounded-xl transition active:scale-95">模擬跑 1 步</button>
                    <button id="task-green" disabled class="bg-slate-100 text-slate-400 font-bold py-3 rounded-xl cursor-not-allowed">等待任務...</button>
                </div>
            </div>
        </div>

        <!-- 凱比導覽與任務回饋區 -->
        <section id="feedbackArea" class="hidden fade-in">
            <div class="bg-white rounded-3xl shadow-xl p-8 border border-slate-200 relative overflow-hidden">
                <div id="taskActiveBadge" class="absolute top-0 right-0 bg-orange-500 text-white px-8 py-1 rotate-45 translate-x-8 translate-y-4 font-bold text-sm">任務進行中</div>
                
                <div class="flex flex-col md:flex-row gap-8 items-center">
                    <div class="w-32 h-32 bg-slate-100 rounded-full flex items-center justify-center text-6xl shadow-inner animate-pulse" id="foodIcon">❓</div>
                    <div class="flex-1 space-y-4 text-center md:text-left">
                        <div>
                            <h3 id="foodTitle" class="text-3xl font-black text-slate-800">請掃描食材 RFID 卡片</h3>
                            <p id="foodLocation" class="text-slate-500">正在等待玩家選擇...</p>
                        </div>
                        
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div class="bg-blue-50 p-4 rounded-2xl border border-blue-100">
                                <p class="text-xs font-bold text-blue-500 mb-1 uppercase tracking-widest">🌍 碳數據</p>
                                <p id="foodCarbon" class="font-bold text-blue-800">尚未讀取</p>
                            </div>
                            <div id="allergenBox" class="bg-slate-50 p-4 rounded-2xl border border-slate-200">
                                <p class="text-xs font-bold text-slate-500 mb-1 uppercase tracking-widest">⚠️ 過敏警報</p>
                                <p id="foodAllergen" class="font-bold text-slate-800">尚未讀取</p>
                            </div>
                            <div class="bg-green-50 p-4 rounded-2xl border border-green-100">
                                <p class="text-xs font-bold text-green-500 mb-1 uppercase tracking-widest">📖 特色簡介</p>
                                <p id="foodIntro" class="text-xs font-medium text-green-800 leading-tight">請感應實體卡片以獲得詳情</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 模擬 RFID 選卡 (Demo 使用) -->
                <div id="rfidSimulator" class="mt-8 pt-6 border-t border-slate-100">
                    <p class="text-xs font-bold text-slate-400 mb-4 text-center uppercase tracking-widest">Demo 專用：模擬 RFID 卡片選擇</p>
                    <div id="foodGrid" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-5 gap-2">
                        <!-- 由 JS 生成 -->
                    </div>
                </div>
            </div>
        </section>

        <!-- 管理後台 (隱藏) -->
        <section id="adminPanel" class="hidden bg-slate-800 text-white p-6 rounded-2xl">
            <h4 class="font-bold mb-4">系統設定</h4>
            <div class="flex gap-4">
                <input type="password" id="apiKeyInput" placeholder="Gemini API Key" class="bg-slate-700 p-2 rounded text-sm flex-1">
                <button onclick="connectSerial()" class="bg-blue-600 px-4 py-2 rounded text-sm font-bold">連線 micro:bit</button>
            </div>
        </section>

    </main>

    <script>
        // 13 鄉鎮農產資料庫 (擴充至 20 種)
        const database = {
            'P01': { icon: '🍠', title: '竹山紅土地瓜', allergen: '🟢 安全無敏', carbon: '🌱 減碳 96%', story: '竹山紅土孕育出的地瓜最甜了，是路跑後最好的澱粉補充！' },
            'P02': { icon: '🍡', title: '草屯手工麻糬', allergen: '🔴 含花生、糯米', carbon: '🌱 在地米材', story: '草屯在地糯米做的麻糬，Q彈有力，但要注意花生過敏喔！' },
            'P03': { icon: '🍵', title: '鹿谷凍頂茶', allergen: '🟢 天然無敏', carbon: '🌱 在地烘焙', story: '鹿谷山上清晨採收的茶葉，回甘一整天！' },
            'P04': { icon: '🍍', title: '微熱山丘鳳梨酥', allergen: '🔴 含蛋、小麥', carbon: '🌱 契作鳳梨', story: '南投名聞遐邇的鳳梨酥，酸酸甜甜就像戀愛的滋味。' },
            'P05': { icon: '🍇', title: '信義巨峰葡萄', allergen: '🟢 安全無敏', carbon: '🌱 高山鮮採', story: '信義鄉黑寶石葡萄，不用去皮直接吃，營養滿分！' },
            'P06': { icon: '🍯', title: '中寮龍眼蜂蜜', allergen: '🟡 嬰兒忌食', carbon: '🌱 友善蜜源', story: '中寮山區純淨蜂蜜，甜蜜你的每一天。' },
            'P07': { icon: '🍄', title: '埔里高山香菇', allergen: '🟢 天然無敏', carbon: '🌱 段木栽培', story: '埔里好水種出來的香菇，煮湯最鮮美。' }
            // ... 可視需求繼續增加
        };

        let gameState = {
            red: { steps: 0, township: 0, needsAction: false },
            green: { steps: 0, township: 0, needsAction: false },
            activeTeam: null
        };

        function addSteps(team) {
            if (gameState[team].needsAction) return; // 必須先選卡片

            gameState[team].steps++;
            document.getElementById(`steps-${team}`).innerText = gameState[team].steps;
            
            let progress = (gameState[team].steps % 10) * 10;
            document.getElementById(`progress-${team}`).style.width = `${progress}%`;
            document.getElementById(`avatar-${team}`).classList.add('running');
            setTimeout(() => document.getElementById(`avatar-${team}`).classList.remove('running'), 200);

            // 每跑 10 步觸發任務
            if (gameState[team].steps > 0 && gameState[team].steps % 10 === 0) {
                triggerTask(team);
            }
        }

        function triggerTask(team) {
            gameState[team].needsAction = true;
            gameState.activeTeam = team;
            
            // UI 回饋
            const btn = document.getElementById(`task-${team}`);
            btn.disabled = false;
            btn.classList.remove('bg-slate-100', 'text-slate-400', 'cursor-not-allowed');
            btn.classList.add('bg-orange-500', 'text-white', 'animate-bounce');
            btn.innerText = "請刷卡選擇食材";

            document.getElementById(`card-${team}`).classList.add('card-active');
            document.getElementById('feedbackArea').classList.remove('hidden');
            document.getElementById('foodTitle').innerText = `請 ${team === 'red' ? '紅隊' : '綠隊'} 優先選擇食材`;
            document.getElementById('foodLocation').innerText = `目前進度：${townships[gameState[team].township]}`;
            
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        function selectFood(id) {
            if (!gameState.activeTeam) return;
            const team = gameState.activeTeam;
            const food = database[id];
            
            // 更新 UI
            document.getElementById('foodIcon').innerText = food.icon;
            document.getElementById('foodTitle').innerText = food.title;
            document.getElementById('foodLocation').innerText = `已完成：${townships[gameState[team].township]} 站`;
            document.getElementById('foodCarbon').innerText = food.carbon;
            document.getElementById('foodAllergen').innerText = food.allergen;
            document.getElementById('foodIntro').innerText = food.story;

            // 處理過敏原顏色
            const abox = document.getElementById('allergenBox');
            if(food.allergen.includes('🔴')) {
                abox.className = "bg-red-50 p-4 rounded-2xl border border-red-100";
            } else if(food.allergen.includes('🟡')) {
                abox.className = "bg-yellow-50 p-4 rounded-2xl border border-yellow-100";
            } else {
                abox.className = "bg-green-50 p-4 rounded-2xl border border-green-100";
            }

            // 進階到下一站
            updateTownship(team);
            
            // 語音回饋
            speak(`恭喜${team === 'red' ? '紅隊' : '綠隊'}，這款${food.title}，${food.story}`);

            // 重置狀態
            gameState[team].needsAction = false;
            gameState.activeTeam = null;
            const btn = document.getElementById(`task-${team}`);
            btn.disabled = true;
            btn.innerText = "已完成站點任務";
            btn.className = "bg-slate-100 text-slate-400 font-bold py-3 rounded-xl cursor-not-allowed";
            document.getElementById(`card-${team}`).classList.remove('card-active');
            
            // 3秒後隱藏導覽區
            setTimeout(() => { if(!gameState.activeTeam) document.getElementById('feedbackArea').classList.add('hidden'); }, 10000);
        }

        function updateTownship(team) {
            const oldIdx = gameState[team].township;
            gameState[team].township++;
            if (gameState[team].township >= townships.length) {
                alert(`恭喜 ${team === 'red' ? '紅隊' : '綠隊'} 成功環繞南投一周！`);
                gameState[team].township = 0;
            }
            
            // 地圖標記
            document.getElementById(`pos-${team}`).innerText = townships[gameState[team].township];
            document.querySelectorAll('.township-dot').forEach(el => el.classList.remove('active-township'));
            document.getElementById(`town-${gameState[team].township}`).classList.add('active-township');
        }

        function speak(text) {
            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'zh-TW';
            utter.rate = 1.1;
            window.speechSynthesis.speak(utter);
        }

        function toggleAdmin() { document.getElementById('adminPanel').classList.toggle('hidden'); }

        function init() {
            const grid = document.getElementById('foodGrid');
            Object.keys(database).forEach(id => {
                const btn = document.createElement('button');
                btn.className = "bg-white border p-2 rounded-lg text-xs hover:bg-slate-50 transition shadow-sm";
                btn.innerHTML = `${database[id].icon} ${database[id].title}`;
                btn.onclick = () => selectFood(id);
                grid.appendChild(btn);
            });
            // 預設高亮第一個站點
            document.getElementById('town-0').classList.add('active-township');
        }

        window.onload = init;

        // Web Serial (選配)
        async function connectSerial() {
            try {
                const port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                document.getElementById('connectionStatus').className = "text-xs bg-green-700 px-3 py-1 rounded-full border border-green-500";
                document.getElementById('connectionStatus').innerHTML = '<i class="fa-solid fa-link mr-1"></i> micro:bit 已連線';
                readLoop(port);
            } catch(e) { console.error(e); }
        }

        async function readLoop(port) {
            const reader = port.readable.getReader();
            let buffer = "";
            while (true) {
                const { value, done } = await reader.read();
                if (done) break;
                buffer += new TextDecoder().decode(value);
                const lines = buffer.split("\n");
                buffer = lines.pop();
                for (let line of lines) {
                    let cmd = line.trim();
                    if(cmd === "STEP_RED") addSteps('red');
                    if(cmd === "STEP_GREEN") addSteps('green');
                    if(database[cmd]) selectFood(cmd);
                }
            }
        }
    </script>
</body>
</html>
