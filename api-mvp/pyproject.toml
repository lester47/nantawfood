[project]
name = "nantou-food-api-mvp"
version = "0.1.0"
description = "FastAPI MVP backend for Nantou food website"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.128,<0.129",
  "uvicorn>=0.38,<0.39",
  "httpx>=0.28,<0.29"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "httpx>=0.28,<0.29"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
